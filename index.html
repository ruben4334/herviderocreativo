<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hervidero Creativo</title>
<meta name="description" content="Hervidero Creativo, desde Castilla-La Mancha. Las ideas ya están brotando. Muy pronto, nuestra web.">
<meta property="og:title" content="Hervidero Creativo">
<meta property="og:description" content="Desde Castilla-La Mancha. Las ideas ya están brotando. Muy pronto, nuestra web.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#1b1430">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23e08a3c'/%3E%3Cpath d='M8 42c8-4 16 4 24 0s16-4 24 0v10H8z' fill='%232f5f5c'/%3E%3Ccircle cx='26' cy='30' r='5' fill='none' stroke='%23fbf1de' stroke-width='3.5'/%3E%3Ccircle cx='38' cy='20' r='3.5' fill='none' stroke='%23fbf1de' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script>document.documentElement.classList.add('js')</script>
<style>
  :root{
    --bg:#1b1430;
    --ink:#fbf1de;
    --muted:rgba(251,241,222,.72);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:'Instrument Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #back{z-index:1;cursor:pointer;touch-action:none}
  #front{z-index:3;pointer-events:none}

  .stage{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;
    padding:clamp(36px,9vh,104px) 16px 0;text-align:center;pointer-events:none}
  .kicker{margin:0;letter-spacing:.34em;text-transform:uppercase;font-size:12px;font-weight:500;color:var(--muted)}
  h1{margin:.35em 0 .1em;line-height:.95;font-family:'Instrument Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-weight:600}
  h1 .row{display:block;white-space:nowrap}
  h1 .r1{font-weight:600;letter-spacing:-.04em;
    font-size:clamp(50px,12vw,150px);text-shadow:0 4px 30px rgba(30,10,30,.45)}
  h1 .r2{font-weight:500;letter-spacing:-.035em;
    font-size:clamp(42px,10vw,124px);text-shadow:0 0 36px rgba(240,150,60,.3)}
  h1 .ch{display:inline-block;will-change:transform,opacity}
  .tag{margin:.7em 0 0;font-size:clamp(16px,2vw,20px);line-height:1.5;color:var(--muted);max-width:32ch;
    text-shadow:0 1px 12px rgba(20,8,20,.7)}

  .foot{position:fixed;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));z-index:4;
    display:flex;flex-direction:column;align-items:center;gap:12px;padding:0 16px;pointer-events:none}
  .cta{pointer-events:auto;color:var(--ink);text-decoration:none;font-size:14px;font-weight:500;letter-spacing:.02em;
    border:1px solid rgba(251,241,222,.3);padding:11px 22px;border-radius:999px;
    background:rgba(27,20,48,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    transition:background .25s,border-color .25s,transform .25s,color .25s}
  .cta:hover,.cta:focus-visible{background:rgba(236,160,70,.92);color:#2a1408;border-color:transparent;transform:translateY(-2px);outline:none}
  .small{text-align:center;line-height:1.7;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(251,241,222,.58);text-shadow:0 1px 8px rgba(0,0,0,.85)}
  .hint{position:fixed;z-index:4;left:50%;transform:translateX(-50%);font-size:12px;letter-spacing:.2em;
    text-transform:uppercase;color:rgba(251,241,222,.8);text-shadow:0 1px 10px rgba(0,0,0,.9);pointer-events:none;white-space:nowrap}

  .js .fade{opacity:0;transition:opacity 1.4s ease}
  .js .fade.on{opacity:1}
  .js h1 .ch{opacity:0}
  @media (prefers-reduced-motion:reduce){ .js .fade{transition:none} }
</style>
</head>
<body>
  <canvas id="back" aria-hidden="true"></canvas>

  <main class="stage">
    <p class="kicker fade" data-d="300">Algo burbujea en La Mancha</p>
    <h1 aria-label="Hervidero Creativo">
      <span class="row r1" aria-hidden="true">Hervidero</span>
      <span class="row r2" aria-hidden="true">Creativo</span>
    </h1>
    <p class="tag fade" data-d="2200">Las ideas ya están brotando.<br>Muy pronto, nuestra web.</p>
  </main>

  <div class="hint fade" id="hint" data-d="4400">Haz clic en el agua</div>

  <footer class="foot">
    <a class="cta fade" data-d="2700" href="mailto:super@herviderocreativo.com">Escríbenos</a>
    <span class="small fade" data-d="3100">© 2026 Hervidero Creativo <span style="white-space:nowrap">· Castilla-La Mancha</span></span>
  </footer>

  <canvas id="front" aria-hidden="true"></canvas>

<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const touch = matchMedia('(hover: none)').matches;
  const back = document.getElementById('back'), bx = back.getContext('2d');
  const front = document.getElementById('front'), fx = front.getContext('2d');
  const bgC = document.createElement('canvas'), bg = bgC.getContext('2d');       // paisaje fijo
  const scC = document.createElement('canvas'), sc = scC.getContext('2d');       // paisaje + aspas (se refleja)
  const tag = document.querySelector('.tag');
  const hint = document.getElementById('hint');
  if (touch) hint.textContent = 'Toca el agua';

  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  function seeded(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const SEED = (Math.random() * 1e9) | 0;
  const oct = (fs, as) => fs.map((f, i) => ({ f, a: as[i], p: Math.random() * 6.28 }));
  const NZ = { far: oct([.0024, .0063, .017], [1, .4, .15]), bed: oct([.006, .017], [1, .4]) };
  const noise = (o, x) => o.reduce((s, k) => s + Math.sin(x * k.f + k.p) * k.a, 0);

  /* ---------- Letras ---------- */
  const chars = [];
  document.querySelectorAll('h1 .row').forEach((row, ri) => {
    const txt = row.textContent; row.textContent = '';
    [...txt].forEach((ch, i) => {
      const s = document.createElement('span');
      s.className = 'ch'; s.textContent = ch;
      if (ri === 1) { const k = i / Math.max(1, txt.length - 1);   // azafrán → tierra roja
        s.style.color = `hsl(${44 - k * 32},${88 - k * 8}%,${62 - k * 4}%)`; }
      row.appendChild(s); chars.push(s);
    });
  });
  document.querySelectorAll('.fade').forEach(el => setTimeout(() => el.classList.add('on'), reduce ? 0 : +el.dataset.d || 0));
  let hintGone = false;
  const killHint = () => { if (!hintGone) { hintGone = true; hint.classList.remove('on'); } };

  /* ---------- Sprites ---------- */
  function radial(stops) {
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const s = c.getContext('2d'), g = s.createRadialGradient(64, 64, 0, 64, 64, 64);
    stops.forEach(([o, col]) => g.addColorStop(o, col)); s.fillStyle = g; s.fillRect(0, 0, 128, 128); return c;
  }
  const mist = radial([[0, 'rgba(255,238,220,1)'], [.5, 'rgba(255,238,220,.3)'], [1, 'rgba(255,238,220,0)']]);
  const mote = radial([[0, 'rgba(255,245,215,1)'], [.2, 'rgba(255,205,120,.75)'], [.55, 'rgba(255,170,80,.15)'], [1, 'rgba(255,170,80,0)']]);

  /* ---------- Estado ---------- */
  let W = 0, H = 0, DPR = 1, surf = 0, step = 8, N = 0, hgt, vel, S = 1;
  let vents = [], pebbles = [], reeds = [], motes = [], beams = [], mills = [];
  const bubbles = [], drops = [], grains = [], steam = [], leaves = [];
  let flock = null, flockT = 3;
  let T = 0, boil = 0, burst = 0, sAcc = 0, seepAcc = 0, leafT = 2;
  const ptr = { x: -1, y: -1, px: -1, py: -1, on: false };

  const bedAt = x => surf + (H - surf) * .8 + noise(NZ.bed, x) * (H - surf) * .05;
  // relieve: cerros volcánicos del Campo de Calatrava y la loma de los molinos
  let cones = [], crest = null, castle = null;
  const gauss = (x, c, w) => Math.exp(-(((x - c) / w) ** 2));
  const coneH = x => cones.reduce((m, c) => Math.max(m, c.h * gauss(x, c.x, c.w)), 0);
  const crestH = x => crest.h * Math.exp(-(((x - crest.x) / crest.w) ** 4));

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    for (const [c, x] of [[back, bx], [front, fx]]) {
      c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); x.setTransform(DPR, 0, 0, DPR, 0, 0);
    }
    const tb = tag.getBoundingClientRect().bottom;
    surf = Math.round(Math.min(H * .78, Math.max(H * .56, tb + 64)));
    step = W < 700 ? 6 : 8; N = Math.ceil(W / step) + 2;
    hgt = new Float32Array(N); vel = new Float32Array(N);
    const R = seeded(SEED), sm = W < 700;
    S = clamp(H / 900, .7, 1.15) * (sm ? .82 : 1);

    cones = [
      { x: W * (sm ? .72 : .58), w: W * (sm ? .16 : .09), h: H * .075 },
      { x: W * (sm ? .9 : .82), w: W * (sm ? .14 : .1), h: H * .095 },
      { x: W * (sm ? .48 : .43), w: W * (sm ? .1 : .06), h: H * .045 },
    ];
    crest = { x: W * (sm ? .18 : .2), w: W * (sm ? .26 : .17), h: H * .07 };
    castle = { x: cones[1].x };
    const nm = sm ? 2 : 4;
    mills = Array.from({ length: nm }, (_, i) => {
      const x = crest.x + (i - (nm - 1) / 2) * crest.w * (sm ? .62 : .42);
      return { x, base: surf - crestH(x) + 2, ph: R() * 6.28, sp: .28 + R() * .12 };
    });

    const nv = sm ? 3 : 5;
    vents = Array.from({ length: nv }, (_, i) => ({
      x: (i + .5 + (R() - .5) * .5) / nv * W, sp: .6 + R() * .9, ph: R() * 6.28, acc: 0, gacc: 0 }));
    pebbles = Array.from({ length: Math.round(W / 22) }, () => {
      const x = R() * W, r = 2 + R() * 6; return { x, y: bedAt(x) + 3 + R() * 22, rx: r, ry: r * (.5 + R() * .2), l: 20 + R() * 18, h: 14 + R() * 18 }; });
    reeds = [];
    const nr = sm ? 6 : 13;
    for (const side of [0, 1]) for (let i = 0; i < nr; i++) {
      const x = side ? W - R() * W * .1 + 6 : R() * W * .1 - 6;
      reeds.push({ x, top: surf - (25 + R() * (sm ? 80 : 130)), w: 2.5 + R() * 3.5, lean: (side ? -1 : 1) * (4 + R() * 26),
        ph: R() * 6.28, sp: .7 + R() * .6, tail: R() < .35, shade: R() });
    }
    motes = Array.from({ length: sm ? 12 : 22 }, () => ({ x: R() * W, y: surf - 6 - R() * H * .2, vx: 0, vy: 0, ph: R() * 6.28 }));
    beams = Array.from({ length: sm ? 2 : 4 }, () => ({ x: R() * W, w: 40 + R() * 90, sk: -60 - R() * 120, ph: R() * 6.28 }));
    buildBg(R);
    scC.width = bgC.width; scC.height = bgC.height; sc.setTransform(DPR, 0, 0, DPR, 0, 0);
    hint.style.top = Math.min(H - 120, surf + (H - surf) * .42) + 'px';
  }

  /* Paisaje fijo: atardecer manchego */
  function buildBg(R) {
    bgC.width = Math.round(W * DPR); bgC.height = Math.round((surf + 2) * DPR);
    bg.setTransform(DPR, 0, 0, DPR, 0, 0);
    const sky = bg.createLinearGradient(0, 0, 0, surf);
    sky.addColorStop(0, '#1b1430'); sky.addColorStop(.35, '#3b2547'); sky.addColorStop(.62, '#8a3f45');
    sky.addColorStop(.85, '#e0793c'); sky.addColorStop(1, '#f6b55a');
    bg.fillStyle = sky; bg.fillRect(0, 0, W, surf + 2);
    for (let i = 0; i < 60; i++) {
      const y = R() * surf * .35; bg.globalAlpha = (.12 + R() * .45) * (1 - y / (surf * .35));
      bg.fillStyle = '#fff'; bg.fillRect(R() * W, y, 1, 1);
    }
    bg.globalAlpha = 1;
    // nubes alargadas encendidas por el sol
    for (let i = 0; i < 5; i++) {
      const cy = surf * (.5 + R() * .3), cx = R() * W, cw = W * (.12 + R() * .2), ch = 2 + R() * 3.5;
      const g = bg.createLinearGradient(cx - cw, 0, cx + cw, 0);
      const col = cy > surf * .62 ? '255,170,110' : '200,110,120';
      g.addColorStop(0, `rgba(${col},0)`); g.addColorStop(.5, `rgba(${col},${.16 + R() * .18})`); g.addColorStop(1, `rgba(${col},0)`);
      bg.fillStyle = g; bg.beginPath(); bg.ellipse(cx, cy, cw, ch, 0, 0, 6.2832); bg.fill();
    }
    // sol bajo
    const sx = W * .64, sy = surf - H * .045, sr = Math.max(26, H * .05);
    const halo = bg.createRadialGradient(sx, sy, 0, sx, sy, Math.max(W, H) * .6);
    halo.addColorStop(0, 'rgba(255,214,140,.7)'); halo.addColorStop(.12, 'rgba(255,170,90,.32)'); halo.addColorStop(1, 'rgba(255,140,80,0)');
    bg.fillStyle = halo; bg.fillRect(0, 0, W, surf + 2);
    bg.fillStyle = '#ffe2a3'; bg.beginPath(); bg.arc(sx, sy, sr, 0, 6.2832); bg.fill();

    // sierra lejana
    bg.beginPath(); bg.moveTo(0, surf + 2);
    for (let x = 0; x <= W + 6; x += 6) bg.lineTo(x, surf - H * .05 - noise(NZ.far, x) * H * .012);
    bg.lineTo(W, surf + 2); bg.closePath(); bg.fillStyle = 'rgba(120,60,80,.5)'; bg.fill();

    // cerros volcánicos
    bg.beginPath(); bg.moveTo(0, surf + 2);
    for (let x = 0; x <= W + 4; x += 4) bg.lineTo(x, surf - 6 - coneH(x));
    bg.lineTo(W, surf + 2); bg.closePath(); bg.fillStyle = '#5a2e3a'; bg.fill();

    // castillo sobre el cerro de la derecha
    const cb = surf - 6 - coneH(castle.x) + 3, u = 4.2 * S;
    bg.fillStyle = '#3c1d28';
    bg.fillRect(castle.x - 9 * u, cb - 5 * u, 18 * u, 5 * u);
    bg.fillRect(castle.x - 2.5 * u, cb - 11 * u, 6 * u, 11 * u);
    for (let i = -9; i < 9; i += 3) bg.fillRect(castle.x + i * u, cb - 6.2 * u, 1.6 * u, 1.4 * u);
    for (let i = -2.5; i < 3.5; i += 2.2) bg.fillRect(castle.x + i * u, cb - 12.2 * u, 1.3 * u, 1.4 * u);

    // loma de los molinos
    bg.beginPath(); bg.moveTo(0, surf + 2);
    for (let x = 0; x <= W + 4; x += 4) bg.lineTo(x, surf - crestH(x));
    bg.lineTo(W, surf + 2); bg.closePath(); bg.fillStyle = '#3a1f26'; bg.fill();

    // torres de los molinos (las aspas giran aparte)
    for (const m of mills) {
      const b = m.base, h = 36 * S, wb = 12 * S, wt = 9 * S;
      bg.beginPath(); bg.moveTo(m.x - wb, b); bg.lineTo(m.x - wt, b - h); bg.lineTo(m.x + wt, b - h); bg.lineTo(m.x + wb, b); bg.closePath();
      bg.fillStyle = '#2b161d'; bg.fill();
      const rim = bg.createLinearGradient(m.x - wb, 0, m.x + wb, 0);
      rim.addColorStop(.6, 'rgba(255,180,110,0)'); rim.addColorStop(1, 'rgba(255,180,110,.35)');
      bg.fillStyle = rim; bg.fill();
      bg.beginPath(); bg.moveTo(m.x - wt - 2 * S, b - h); bg.lineTo(m.x, b - h - 11 * S); bg.lineTo(m.x + wt + 2 * S, b - h); bg.closePath();
      bg.fillStyle = '#1f0f15'; bg.fill();
      bg.fillStyle = 'rgba(255,190,120,.55)'; bg.fillRect(m.x - 1.4 * S, b - h * .55, 2.8 * S, 4 * S);
    }

    // olivares en la llanura
    bg.fillStyle = '#2a1419'; bg.fillRect(0, surf - 3, W, 5);
    for (let x = -10; x < W + 10; x += 10 + R() * 16) {
      if (crestH(x) > 12 || coneH(x) > 14) continue;
      const r = (4 + R() * 4) * S, b = surf - 1;
      bg.fillStyle = '#26121a';
      bg.fillRect(x - .8, b - r * .9, 1.6, r * .9);
      bg.beginPath(); bg.ellipse(x, b - r * 1.3, r * 1.3, r * .85, 0, 0, 6.2832); bg.fill();
      bg.beginPath(); bg.ellipse(x + r * .6, b - r * 1.6, r * .8, r * .6, 0, 0, 6.2832); bg.fill();
    }
  }

  addEventListener('resize', resize);
  resize();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(resize);

  /* ---------- Superficie ---------- */
  const amb = x => { const a = 1 + 2.2 * boil; return Math.sin(x * .011 + T * 1.1) * a * .6 + Math.sin(x * .027 - T * 1.7) * a * .4; };
  const idx = x => clamp(Math.round(x / step), 0, N - 1);
  const surfAt = x => surf + hgt[idx(x)] + amb(x);
  function poke(x, f) { const i = idx(x); for (let k = -2; k <= 2; k++) { const j = i + k; if (j >= 0 && j < N) vel[j] += f * (1 - Math.abs(k) * .3); } }
  function waterStep() {
    for (let i = 0; i < N; i++) { vel[i] += -.025 * hgt[i] - .045 * vel[i]; hgt[i] += vel[i]; }
    for (let p = 0; p < 3; p++) for (let i = 1; i < N - 1; i++) vel[i] += .1 * (hgt[i - 1] + hgt[i + 1] - 2 * hgt[i]);
  }

  /* ---------- Partículas ---------- */
  function addBubble(x, y, r) { if (bubbles.length < 420) bubbles.push({ x, y, r, vy: -rnd(8, 30), ph: rnd(0, 6.28), w: rnd(.5, 2) }); }
  function addSteam(x, y, big) {
    if (steam.length < 120) steam.push({ x, y, vx: rnd(-10, 4), vy: -rnd(8, 20), life: 0, max: rnd(3, 6), size: rnd(30, 60) * (big ? 1.5 : 1), seed: rnd(0, 6.28) });
  }
  function pop(b, sy) {
    poke(b.x, -b.r * .55);
    if (b.r > 3.6) for (let i = 0, n = Math.min(5, b.r / 2 | 0); i < n && drops.length < 240; i++)
      drops.push({ x: b.x, y: sy - 2, vx: rnd(-50, 50), vy: -rnd(70, 170) * (b.r / 7), r: rnd(.8, 1.8) });
    if (Math.random() < .08 + boil * .08) addSteam(b.x, sy, b.r > 5);
  }
  function geyser(x) {
    const sy = surfAt(x);
    for (let i = 0; i < 60 && drops.length < 320; i++)
      drops.push({ x: x + rnd(-5, 5), y: sy - 2, vx: rnd(-55, 55), vy: -rnd(200, 520), r: rnd(1, 2.8) });
    poke(x, -16);
    const by = bedAt(x);
    for (let i = 0; i < 26; i++) addBubble(x + rnd(-30, 30), by - rnd(0, 10), rnd(1.5, 5.5));
    for (let i = 0; i < 8; i++) grains.push({ x: x + rnd(-10, 10), y: by, vx: rnd(-40, 40), vy: -rnd(40, 110) });
    for (let i = 0; i < 4; i++) addSteam(x + rnd(-30, 30), sy - rnd(0, 40), true);
    burst = Math.min(1.4, burst + .8);
  }

  /* ---------- Interacción ---------- */
  function setPtr(e) { ptr.px = ptr.on ? ptr.x : e.clientX; ptr.py = ptr.on ? ptr.y : e.clientY; ptr.x = e.clientX; ptr.y = e.clientY; ptr.on = true; }
  back.addEventListener('pointermove', setPtr);
  back.addEventListener('pointerleave', () => ptr.on = false);
  back.addEventListener('pointerup', () => { if (touch) ptr.on = false; });
  back.addEventListener('pointerdown', e => { setPtr(e); killHint(); geyser(e.clientX); });

  /* ---------- Bucle ---------- */
  const start = performance.now(); let last = start, simAcc = 0;
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now; T += dt;
    const t = (now - start) / 1000;
    const ramp = reduce ? .5 : Math.min(1, t / 2.8);
    burst *= Math.pow(.3, dt);
    boil = ramp * ramp * (3 - 2 * ramp) * (.9 + .1 * Math.sin(T * .4)) + burst * .6;
    const k = reduce ? .35 : 1;

    simAcc += dt; while (simAcc >= 1 / 60) { waterStep(); simAcc -= 1 / 60; }

    if (ptr.on && ptr.y > surfAt(ptr.x) - 40) {
      const sp = Math.hypot(ptr.x - ptr.px, ptr.y - ptr.py);
      if (sp > .5) poke(ptr.x, -Math.min(3.5, sp * .08));
      if (ptr.y > surfAt(ptr.x) && Math.random() < .25) addBubble(ptr.x + rnd(-6, 6), ptr.y, rnd(1, 2.5));
    }
    ptr.px = ptr.x; ptr.py = ptr.y;

    // hervideros: el gas sale a borbotones del lecho ferruginoso
    for (const v of vents) {
      const pulse = Math.pow(.5 + .5 * Math.sin(T * v.sp + v.ph), 3);
      v.p = pulse;
      v.acc += (7 + pulse * 50 + burst * 30) * boil * k * dt;
      const by = bedAt(v.x);
      while (v.acc >= 1) { v.acc--; addBubble(v.x + rnd(-9, 9), by - 2, rnd(1, 2 + 3.4 * pulse)); }
      v.gacc += pulse * 10 * boil * k * dt;
      while (v.gacc >= 1) { v.gacc--; if (grains.length < 220) grains.push({ x: v.x + rnd(-5, 5), y: by - 1, vx: rnd(-30, 30), vy: -rnd(20, 70) * (.5 + pulse) }); }
    }
    seepAcc += 16 * boil * k * (W / 1200) * dt;
    while (seepAcc >= 1) { seepAcc--; const x = rnd(0, W); addBubble(x, bedAt(x) - 2, rnd(.8, 1.8)); }
    sAcc += (1 + boil * 3) * (W / 1200) * k * dt;
    while (sAcc >= 1) { sAcc--; const x = rnd(0, W); addSteam(x, surfAt(x)); }

    for (let i = bubbles.length - 1; i >= 0; i--) {
      const b = bubbles[i];
      b.vy -= (24 + b.r * 13) * dt; b.vy *= .985; b.y += b.vy * dt;
      b.x += Math.sin(T * 3 * b.w + b.ph) * b.r * .1;
      b.r = Math.min(b.r * (1 + .12 * dt), 9);
      const sy = surfAt(b.x);
      if (b.y - b.r * .3 <= sy) { pop(b, sy); bubbles.splice(i, 1); }
    }
    for (let i = drops.length - 1; i >= 0; i--) {
      const d = drops[i]; d.vy += 650 * dt; d.x += d.vx * dt; d.y += d.vy * dt;
      if (d.vy > 0 && d.y > surfAt(d.x)) { poke(d.x, 1.1 * d.r); drops.splice(i, 1); }
    }
    for (let i = grains.length - 1; i >= 0; i--) {
      const g = grains[i]; g.vy += 140 * dt; g.vx *= .97; g.x += g.vx * dt; g.y += g.vy * dt;
      if (g.vy > 0 && g.y >= bedAt(g.x)) grains.splice(i, 1);
    }
    for (let i = steam.length - 1; i >= 0; i--) {
      const s = steam[i]; s.life += dt;
      s.x += (s.vx + Math.sin(T * .5 + s.seed) * 6) * dt; s.y += s.vy * dt; s.vy *= (1 - .1 * dt); s.size += 18 * dt;
      if (s.life > s.max) steam.splice(i, 1);
    }
    // hojas de vid otoñales
    leafT -= dt;
    if (leafT <= 0 && leaves.length < 6 && !reduce) {
      leafT = rnd(2.5, 5.5);
      leaves.push({ x: rnd(W * .1, W * .95), y: -20, vy: rnd(28, 46), ph: rnd(0, 6.28), rot: rnd(0, 6.28), rs: rnd(-2, 2),
        s: rnd(6, 10), hue: Math.random() < .5 ? rnd(0, 14) : rnd(30, 46), st: 0, t: 0 });
    }
    for (let i = leaves.length - 1; i >= 0; i--) {
      const l = leaves[i];
      if (!l.st) {
        l.y += l.vy * dt; l.x += (Math.sin(T * 1.4 + l.ph) * 34 - 8) * dt; l.rot += l.rs * dt;
        if (l.y >= surfAt(l.x) - 1) { l.st = 1; poke(l.x, 3); }
      } else {
        l.t += dt; l.x -= 9 * dt; l.y = surfAt(l.x) - 1; l.rot += Math.sin(T + l.ph) * .2 * dt;
        if (l.t > 12 || l.x < -30) leaves.splice(i, 1);
      }
    }
    // motas de polvo dorado a contraluz
    for (const f of motes) {
      f.vx = clamp(f.vx + rnd(-1, 1) * 30 * dt, -12, 12); f.vy = clamp(f.vy + rnd(-1, 1) * 24 * dt, -9, 9);
      f.x += f.vx * dt; f.y += f.vy * dt;
      if (f.x < 0) f.x += W; if (f.x > W) f.x -= W;
      f.y = clamp(f.y, surf - H * .22, surf - 6);
    }
    // bandada de grullas en uve
    flockT -= dt;
    if (!flock && flockT <= 0 && !reduce) {
      const n = W < 700 ? 7 : 9;
      flock = { x: W + 60, y: surf * rnd(.18, .4), v: rnd(30, 42), n };
    }
    if (flock) { flock.x -= flock.v * dt; if (flock.x < -260) { flock = null; flockT = rnd(14, 24); } }

    draw();
    letters(t);
    requestAnimationFrame(frame);
  }

  function surfacePath(ctx, cont) {
    ctx[cont ? 'lineTo' : 'moveTo'](0, surf + hgt[0] + amb(0));
    for (let i = 1; i < N; i++) { const x = i * step; ctx.lineTo(x, surf + hgt[i] + amb(x)); }
  }

  function drawSails(ctx, m) {
    const hub = { x: m.x, y: m.base - 36 * S - 3 * S }, L = 30 * S, wd = 6.5 * S;
    const a0 = T * m.sp + m.ph;
    ctx.save(); ctx.translate(hub.x, hub.y);
    ctx.strokeStyle = '#1e0e14'; ctx.lineCap = 'round';
    for (let i = 0; i < 4; i++) {
      ctx.save(); ctx.rotate(a0 + i * Math.PI / 2);
      ctx.lineWidth = 1.6 * S; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(L, 0); ctx.stroke();
      ctx.lineWidth = .9 * S; ctx.beginPath();
      ctx.rect(L * .25, 0, L * .75, wd);
      for (let j = 1; j < 5; j++) { const xx = L * .25 + j * L * .75 / 5; ctx.moveTo(xx, 0); ctx.lineTo(xx, wd); }
      ctx.moveTo(L * .25, wd / 2); ctx.lineTo(L, wd / 2);
      ctx.stroke();
      ctx.restore();
    }
    ctx.fillStyle = '#1e0e14'; ctx.beginPath(); ctx.arc(0, 0, 2.2 * S, 0, 6.2832); ctx.fill();
    ctx.restore();
  }

  function draw() {
    const x = bx;
    // paisaje con aspas girando (este lienzo es el que se refleja)
    sc.drawImage(bgC, 0, 0, W, surf + 2);
    for (const m of mills) drawSails(sc, m);
    x.drawImage(scC, 0, 0, W, surf + 2);

    // grullas
    if (flock) {
      x.strokeStyle = 'rgba(30,14,24,.8)'; x.lineWidth = 1.4; x.lineCap = 'round';
      for (let i = 0; i < flock.n; i++) {
        const side = i % 2 ? 1 : -1, rank = Math.ceil(i / 2);
        const bxp = flock.x + rank * 20 * S, byp = flock.y + side * rank * 11 * S + Math.sin(T * .8 + i) * 2;
        const f = Math.sin(T * 5 + i * .7) * 4 * S, s = 7 * S;
        x.beginPath(); x.moveTo(bxp - s, byp - f); x.quadraticCurveTo(bxp - s * .4, byp - f * .3 - 2, bxp, byp);
        x.quadraticCurveTo(bxp + s * .4, byp - f * .3 - 2, bxp + s, byp - f); x.stroke();
      }
    }

    // agua
    x.save();
    x.beginPath(); x.moveTo(0, H); surfacePath(x, true); x.lineTo(W, H); x.closePath(); x.clip();
    const wg = x.createLinearGradient(0, surf, 0, H);
    wg.addColorStop(0, '#5a6f6a'); wg.addColorStop(.25, '#2e4d4c'); wg.addColorStop(.75, '#1d2f30'); wg.addColorStop(1, '#2a160c');
    x.fillStyle = wg; x.fillRect(0, surf - 20, W, H - surf + 20);

    const refH = Math.min(H - surf, surf * .55), DH = 3;
    for (let y = 0; y < refH; y += DH) {
      const src = surf - y - DH; if (src < 0) break;
      x.globalAlpha = .55 * (1 - y / refH);
      const off = Math.sin(y * .11 - T * 1.8) * (1 + y * .035) * (1 + boil * .6);
      x.drawImage(scC, 0, src * DPR, scC.width, DH * DPR, off, surf + y, W, DH);
    }
    x.globalAlpha = 1;

    x.globalCompositeOperation = 'lighter';
    for (const b of beams) {
      const a = .03 + .018 * Math.sin(T * .6 + b.ph), bx0 = b.x + Math.sin(T * .2 + b.ph) * 30;
      const g = x.createLinearGradient(0, surf, 0, H); g.addColorStop(0, `rgba(255,200,130,${a})`); g.addColorStop(1, 'rgba(255,200,130,0)');
      x.fillStyle = g; x.beginPath();
      x.moveTo(bx0, surf); x.lineTo(bx0 + b.w, surf); x.lineTo(bx0 + b.w * 1.8 + b.sk, H); x.lineTo(bx0 + b.sk, H); x.closePath(); x.fill();
    }
    for (const v of vents) {
      const by = bedAt(v.x), r = 70 + 50 * (v.p || 0);
      const g = x.createRadialGradient(v.x, by, 0, v.x, by, r);
      g.addColorStop(0, `rgba(230,120,50,${.08 + .1 * (v.p || 0) * boil})`); g.addColorStop(1, 'rgba(230,120,50,0)');
      x.fillStyle = g; x.fillRect(v.x - r, by - r, r * 2, r * 2);
    }
    x.globalCompositeOperation = 'source-over';

    // lecho de arcilla roja con manchas de hierro
    x.beginPath(); x.moveTo(0, H);
    for (let px = 0; px <= W + 8; px += 8) x.lineTo(px, bedAt(px));
    x.lineTo(W, H); x.closePath();
    const sg = x.createLinearGradient(0, surf + (H - surf) * .72, 0, H);
    sg.addColorStop(0, '#9a4e24'); sg.addColorStop(1, '#2e140b');
    x.fillStyle = sg; x.fill();
    for (const p of pebbles) {
      x.beginPath(); x.ellipse(p.x, p.y, p.rx, p.ry, 0, 0, 6.2832);
      x.fillStyle = `hsl(${p.h},30%,${p.l}%)`; x.fill();
    }
    for (const v of vents) {
      const by = bedAt(v.x), w = 12 + 6 * (v.p || 0);
      const st = x.createRadialGradient(v.x, by, 0, v.x, by, w * 2.6);
      st.addColorStop(0, 'rgba(235,130,40,.55)'); st.addColorStop(1, 'rgba(235,130,40,0)');
      x.fillStyle = st; x.beginPath(); x.ellipse(v.x, by + 2, w * 2.6, 8, 0, 0, 6.2832); x.fill();
      x.beginPath(); x.ellipse(v.x, by + 1, w, 3.5, 0, 0, 6.2832); x.fillStyle = 'rgba(30,12,6,.8)'; x.fill();
    }
    x.fillStyle = 'rgba(225,140,70,.9)';
    for (const g of grains) x.fillRect(g.x, g.y, 1.6, 1.6);

    x.lineWidth = 1;
    for (const b of bubbles) {
      x.beginPath(); x.arc(b.x, b.y, b.r, 0, 6.2832);
      x.fillStyle = 'rgba(255,240,220,.07)'; x.fill();
      x.strokeStyle = 'rgba(255,244,228,.55)'; x.stroke();
      if (b.r > 2.4) { x.beginPath(); x.arc(b.x - b.r * .35, b.y - b.r * .38, b.r * .22, 0, 6.2832); x.fillStyle = 'rgba(255,255,255,.75)'; x.fill(); }
    }
    x.restore();

    x.beginPath(); surfacePath(x);
    x.strokeStyle = 'rgba(255,190,110,.18)'; x.lineWidth = 7; x.stroke();
    x.strokeStyle = 'rgba(255,236,205,.6)'; x.lineWidth = 1.3; x.stroke();

    x.fillStyle = 'rgba(255,236,210,.9)';
    for (const d of drops) { x.beginPath(); x.arc(d.x, d.y, d.r, 0, 6.2832); x.fill(); }

    for (const l of leaves) {
      const a = l.st ? clamp((12 - l.t) / 3, 0, 1) : 1;
      x.save(); x.translate(l.x, l.y); x.rotate(l.rot); x.globalAlpha = a;
      x.fillStyle = `hsl(${l.hue},75%,${l.hue < 20 ? 40 : 48}%)`;
      x.beginPath();
      for (let j = 0; j < 5; j++) { const an = -Math.PI / 2 + (j - 2) * .62; x.ellipse(Math.cos(an) * l.s * .45, Math.sin(an) * l.s * .45, l.s * .5, l.s * .28, an, 0, 6.2832); }
      x.fill();
      x.restore();
    }
    x.globalAlpha = 1;

    x.globalCompositeOperation = 'lighter';
    for (const f of motes) {
      const a = (.35 + .35 * Math.sin(T * 1.3 + f.ph)) * Math.min(1, T / 3);
      if (a < .02) continue;
      x.globalAlpha = a; x.drawImage(mote, f.x - 7, f.y - 7, 14, 14);
    }
    x.globalAlpha = 1; x.globalCompositeOperation = 'source-over';

    for (const r of reeds) {
      const sw = Math.sin(T * r.sp + r.ph) * 6 + Math.sin(T * .37 + r.ph) * 3;
      const tx = r.x + r.lean + sw, ty = r.top, cx = r.x + r.lean * .4;
      x.beginPath();
      x.moveTo(r.x - r.w, H + 4);
      x.quadraticCurveTo(cx - r.w * .6, (ty + H) / 2, tx, ty);
      x.quadraticCurveTo(cx + r.w * .6, (ty + H) / 2, r.x + r.w, H + 4);
      x.closePath();
      x.fillStyle = r.shade > .5 ? '#140a0c' : '#1d0f12'; x.fill();
      if (r.tail) {
        x.save(); x.translate(tx - (r.lean + sw) * .04, ty + 16); x.rotate(Math.atan((r.lean + sw) / (H - ty)) * 1.4);
        x.beginPath(); x.ellipse(0, 0, 3.2, 11, 0, 0, 6.2832); x.fillStyle = '#3a1a0e'; x.fill(); x.restore();
      }
    }

    fx.clearRect(0, 0, W, H);
    for (const s of steam) {
      const a = Math.sin(Math.PI * s.life / s.max) * (.035 + .035 * Math.min(1, boil));
      if (a <= 0) continue;
      fx.globalAlpha = a; fx.drawImage(mist, s.x - s.size / 2, s.y - s.size / 2, s.size, s.size);
    }
    fx.globalAlpha = 1;
  }

  function letters(t) {
    for (let i = 0; i < chars.length; i++) {
      const p = reduce ? 1 : clamp((t - .5 - i * .08) / 1.3, 0, 1);
      const e = 1 - Math.pow(1 - p, 3);
      const bob = reduce ? 0 : Math.sin(T * 1.3 + i * .5) * 2.2 * e;
      const y = (1 - e) * 60 + bob;
      const r = reduce ? 0 : Math.sin(T * 1.1 + i * .9) * .7 * e;
      const st = chars[i].style;
      st.transform = `translate3d(0,${y.toFixed(2)}px,0) rotate(${r.toFixed(2)}deg)`;
      st.opacity = Math.min(1, p * 1.5).toFixed(3);
      st.filter = p < 1 ? `blur(${((1 - e) * 10).toFixed(2)}px)` : 'none';
    }
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
