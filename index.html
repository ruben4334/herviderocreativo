<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hervidero Creativo</title>
<meta name="description" content="Hervidero Creativo · Marketing digital. Una web interactiva: descubre sus secretos. Muy pronto, nuestra web completa.">
<meta property="og:title" content="Hervidero Creativo">
<meta property="og:description" content="Marketing digital. Una web viva que cambia con la hora del día y esconde secretos.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#1b1430">
<link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAEklEQVR4XmNgGAWjYBSMAggAAAQQAAFmwWQLAAAAAElFTkSuQmCC">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script>document.documentElement.classList.add('js')</script>
<style>
  :root{
    --bg:#1b1430;
    --ink:#fbf1de;
    --muted:rgba(251,241,222,.74);
    --soft:rgba(251,241,222,.6);
    --accent:rgba(246,181,90,.9);
    --shade:rgba(20,8,20,.75);
    --cta-bg:rgba(27,20,48,.35);
    --cta-line:rgba(251,241,222,.3);
  }
  :root.day{
    --ink:#1c1626;
    --muted:rgba(28,22,38,.82);
    --soft:rgba(28,22,38,.7);
    --accent:rgba(190,80,20,.95);
    --shade:rgba(255,250,240,.75);
    --cta-bg:rgba(255,250,240,.45);
    --cta-line:rgba(28,22,38,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:'Instrument Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #back{z-index:1;cursor:pointer;touch-action:none}
  #front{z-index:3;pointer-events:none}

  .stage{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;
    padding:clamp(24px,8vh,104px) 16px 0;text-align:center;pointer-events:none}
  .kicker{margin:0;letter-spacing:.34em;text-transform:uppercase;font-size:12px;font-weight:500;color:var(--muted);
    text-shadow:0 1px 10px var(--shade)}
  h1{margin:.35em 0 .1em;line-height:.95;font-weight:600}
  h1 .row{display:block;white-space:nowrap}
  h1 .r1{font-weight:600;letter-spacing:-.04em;font-size:clamp(44px,min(12vw,14.5vh),150px);text-shadow:0 4px 30px var(--shade)}
  h1 .r2{font-weight:500;letter-spacing:-.035em;font-size:clamp(36px,min(10vw,12vh),124px);text-shadow:0 0 30px var(--shade)}
  h1 .ch{display:inline-block;will-change:transform,opacity;transition:color 2s}
  .tip{margin:.8em 0 0;font-size:clamp(15px,1.9vw,19px);line-height:1.45;color:var(--muted);max-width:42ch;
    text-shadow:0 1px 14px var(--shade),0 0 3px var(--shade)}
  .tip span{display:inline-block;transition:opacity .6s ease,transform .6s ease}
  .tip span.out{opacity:0;transform:translateY(6px)}
  .tip b{font-weight:600;color:var(--ink)}
  .count{margin:.7em 0 0;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft);
    text-shadow:0 1px 10px var(--shade);display:flex;align-items:center;gap:.8em}
  .value{margin:.75em 0 0;font-size:13px;line-height:1.45;color:var(--muted);max-width:64ch;text-shadow:0 1px 10px var(--shade),0 0 4px var(--shade),0 0 2px var(--shade)}
  @media (max-width:420px){.value{font-size:12px;max-width:32ch}}
  .dots{display:inline-flex;gap:5px}
  .dots i{width:7px;height:7px;border-radius:50%;border:1px solid var(--accent);transition:background .4s,transform .4s}
  .dots i.on{background:var(--accent);transform:scale(1.15)}
  .count.pulse{animation:pulse .8s ease}
  @keyframes pulse{40%{transform:scale(1.12)}}
  .cta.glow{animation:glow 1.6s ease-in-out 3}
  @keyframes glow{50%{box-shadow:0 0 0 8px rgba(246,181,90,.25);background:rgba(236,160,70,.9);color:#2a1408}}
  .services{display:none;margin:.9em 0 0;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);
    text-shadow:0 1px 10px var(--shade);display:flex;flex-wrap:wrap;justify-content:center;gap:.25em .1em}
  .services span{white-space:nowrap}
  .services i{font-style:normal;color:var(--accent);margin:0 .35em}
  @media (max-width:420px){.services{font-size:10.5px;letter-spacing:.1em;max-width:30ch}.kicker{letter-spacing:.2em;font-size:11px}}

  .foot{position:fixed;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));z-index:4;
    display:flex;flex-direction:column;align-items:center;gap:12px;padding:0 16px;pointer-events:none}
  .cta{pointer-events:auto;color:var(--ink);text-decoration:none;font-size:14px;font-weight:500;letter-spacing:.02em;
    border:1px solid var(--cta-line);padding:11px 22px;border-radius:999px;
    background:var(--cta-bg);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    transition:background .25s,border-color .25s,transform .25s,color .25s}
  .cta:hover,.cta:focus-visible{background:rgba(236,160,70,.92);color:#2a1408;border-color:transparent;transform:translateY(-2px);outline:none}
  .small{text-align:center;line-height:1.7;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(251,241,222,.62);text-shadow:0 1px 8px rgba(0,0,0,.85)}
  .hint{position:fixed;z-index:4;left:50%;transform:translateX(-50%);font-size:12px;letter-spacing:.2em;
    text-transform:uppercase;color:rgba(251,241,222,.82);text-shadow:0 1px 10px rgba(0,0,0,.9);pointer-events:none;white-space:nowrap}

  .js .fade{opacity:0;transition:opacity 1.4s ease}
  .js .fade.on{opacity:1}
  .js h1 .ch{opacity:0}
  @media (prefers-reduced-motion:reduce){ .js .fade{transition:none} }
</style>
</head>
<body>
  <canvas id="back" aria-hidden="true"></canvas>

  <main class="stage">
    <p class="kicker fade" data-d="300">Marketing digital</p>
    <h1 aria-label="Hervidero Creativo">
      <span class="row r1" aria-hidden="true">Hervidero</span>
      <span class="row r2" aria-hidden="true">Creativo</span>
    </h1>
    <p class="tip fade" data-d="2200" aria-live="polite"><span id="tipText"></span></p>
    <p class="count fade" data-d="2700" id="count"><span class="dots" id="dots"></span><span id="countText"></span></p>
    <p class="value fade" data-d="3300" id="value">En Hervidero Creativo buscamos y explotamos la curiosidad de tus potenciales clientes.</p>
  </main>


  <footer class="foot">
    <a class="cta fade" data-d="2700" href="mailto:super@herviderocreativo.com">Escríbenos</a>
    <span class="small fade" data-d="3100">© 2026 Hervidero Creativo</span>
  </footer>

  <canvas id="front" aria-hidden="true"></canvas>

<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const touch = matchMedia('(hover: none)').matches;
  const params = new URLSearchParams(location.search);
  const back = document.getElementById('back'), bx = back.getContext('2d');
  const front = document.getElementById('front'), fx = front.getContext('2d');
  const bgC = document.createElement('canvas'), bg = bgC.getContext('2d');   // paisaje fijo
  const scC = document.createElement('canvas'), sc = scC.getContext('2d');   // paisaje + aspas + personajes (se refleja)
  const anchor = document.getElementById('value');
  const FONT = "'Instrument Sans',system-ui,sans-serif";

  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  function seeded(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const SEED = (Math.random() * 1e9) | 0;
  const oct = (fs, as) => fs.map((f, i) => ({ f, a: as[i], p: Math.random() * 6.28 }));
  const NZ = { far: oct([.0024, .0063, .017], [1, .4, .15]), bed: oct([.006, .017], [1, .4]) };
  const noise = (o, x) => o.reduce((s, k) => s + Math.sin(x * k.f + k.p) * k.a, 0);

  /* =====================================================================
     HORA REAL (Europe/Madrid) → altura del sol → paleta del paisaje
     Para previsualizar otra hora: ?hora=21.5
     ===================================================================== */
  function madridNow() {
    const forced = parseFloat(params.get('hora'));
    const d = new Date();
    const doy = Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 864e5);
    let h, off = 1;
    try {
      const p = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Madrid', hour: 'numeric', minute: 'numeric', hourCycle: 'h23', timeZoneName: 'shortOffset' }).formatToParts(d);
      const g = t => (p.find(x => x.type === t) || {}).value;
      h = +g('hour') + +g('minute') / 60;
      const m = /GMT([+-]\d+)/.exec(g('timeZoneName') || ''); off = m ? +m[1] : 1;
    } catch (e) { h = d.getHours() + d.getMinutes() / 60; }
    if (!isNaN(forced)) h = ((forced % 24) + 24) % 24;
    return { h, doy, off };
  }
  function sunState() {
    const { h, doy, off } = madridNow();
    const season = Math.sin(2 * Math.PI * (doy - 80) / 365);
    const dayLen = 12 + 2.75 * season;                 // ~9,3 h en invierno, ~14,7 h en verano (lat. ~39°)
    const noon = 12.25 + off;                          // mediodía solar aprox. en Ciudad Real (long. ~-3,9°)
    const rise = noon - dayLen / 2, set = noon + dayLen / 2;
    const maxAlt = 50.6 + 23.44 * season;
    let alt, p = 0, q = 0, isDay = h >= rise && h <= set;
    if (isDay) { p = (h - rise) / dayLen; alt = maxAlt * Math.sin(Math.PI * p); }
    else { const nl = 24 - dayLen; q = (((h - set) % 24) + 24) % 24 / nl; alt = -50 * Math.sin(Math.PI * q); }
    return { h, alt, p, q, isDay, morning: isDay ? p < .5 : q > .5 };
  }

  const C = (hex, a = 1) => { const n = parseInt(hex.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255, a]; };
  // fotogramas clave por altura del sol (grados)
  const KEYS = [
    { alt: -14, sky: [C('#050816'), C('#0b1430'), C('#141f46'), C('#1f2b55'), C('#2a3762')], far: C('#1e2850', .6), cones: C('#121830'), castle: C('#0c1024'),
      crest: C('#0e1327'), tower: C('#0b0f20'), cap: C('#070a17'), sails: C('#090c1b'), olive: C('#0b1021'), strip: C('#0a0e1d'), silh: C('#03050c'),
      water: [C('#1c2c46'), C('#101d31'), C('#0a1220')], bed: [C('#3a2416'), C('#120a06')], reed: C('#04060c'), cloud: C('#5a6496', .14), bird: C('#020308', .7),
      stars: 1, glow: 0, motes: 0, flies: 1, win: 1, rim: 0, refl: .45 },
    { alt: -5, sky: [C('#121636'), C('#2c2752'), C('#6a3e66'), C('#c86a5e'), C('#efa06a')], far: C('#5c3a62', .5), cones: C('#3e2440'), castle: C('#2a1630'),
      crest: C('#28162a'), tower: C('#20121f'), cap: C('#160a14'), sails: C('#170b14'), olive: C('#1d0f19'), strip: C('#1c0f18'), silh: C('#0e0610'),
      water: [C('#4a5568'), C('#24364a'), C('#162430')], bed: [C('#7a3e1e'), C('#24100a')], reed: C('#0d070b'), cloud: C('#c8708a', .2), bird: C('#120812', .8),
      stars: .55, glow: .7, motes: .4, flies: .4, win: .8, rim: .2, refl: .5 },
    { alt: 0, sky: [C('#1b1430'), C('#3b2547'), C('#8a3f45'), C('#e0793c'), C('#f6b55a')], far: C('#783c50', .5), cones: C('#5a2e3a'), castle: C('#3c1d28'),
      crest: C('#3a1f26'), tower: C('#2b161d'), cap: C('#1f0f15'), sails: C('#1e0e14'), olive: C('#26121a'), strip: C('#2a1419'), silh: C('#140a0e'),
      water: [C('#5a6f6a'), C('#2e4d4c'), C('#1d2f30')], bed: [C('#9a4e24'), C('#2e140b')], reed: C('#140a0c'), cloud: C('#ffaa6e', .25), bird: C('#1e0e18', .8),
      stars: .12, glow: 1, motes: 1, flies: 0, win: .4, rim: .35, refl: .55 },
    { alt: 7, sky: [C('#3a5c90'), C('#7690b4'), C('#d6a882'), C('#f0c07c'), C('#f8d59c')], far: C('#9a7a86', .5), cones: C('#8a5c42'), castle: C('#6a4838'),
      crest: C('#7a4f32'), tower: C('#e6d4ba'), cap: C('#3c2a26'), sails: C('#3a2822'), olive: C('#4a4628'), strip: C('#5a4630'), silh: C('#2a1a12'),
      water: [C('#6c8c8a'), C('#3e6466'), C('#24393c')], bed: [C('#a85a2a'), C('#341a0e')], reed: C('#1e1a10'), cloud: C('#fff0d8', .35), bird: C('#2a2024', .75),
      stars: 0, glow: .6, motes: .7, flies: 0, win: 0, rim: .25, refl: .5 },
    { alt: 22, sky: [C('#3d7cc6'), C('#5e9bd6'), C('#8dbde6'), C('#bcdaf0'), C('#e2eef2')], far: C('#7a94b4', .55), cones: C('#a47c50'), castle: C('#7c6a58'),
      crest: C('#b08856'), tower: C('#f5f1e8'), cap: C('#3e3230'), sails: C('#4a3a30'), olive: C('#56663a'), strip: C('#8a7a4a'), silh: C('#3a2618'),
      water: [C('#5ea4ac'), C('#2f7078'), C('#163a40')], bed: [C('#b0703a'), C('#3a2010')], reed: C('#22301a'), cloud: C('#ffffff', .55), bird: C('#2a2a30', .7),
      stars: 0, glow: .15, motes: 0, flies: 0, win: 0, rim: 0, refl: .45 },
  ];
  const mix = (a, b, t) => Array.isArray(a[0]) ? a.map((v, i) => mix(v, b[i], t)) : (typeof a === 'number' ? lerp(a, b, t) : a.map((v, i) => lerp(v, b[i], t)));
  function envFor(s) {
    const alt = clamp(s.alt, KEYS[0].alt, KEYS[KEYS.length - 1].alt);
    let i = 0; while (i < KEYS.length - 2 && alt > KEYS[i + 1].alt) i++;
    const A = KEYS[i], B = KEYS[i + 1], t = (alt - A.alt) / (B.alt - A.alt);
    const e = {};
    for (const k in A) if (k !== 'alt') e[k] = mix(A[k], B[k], t);
    e.alt = s.alt; e.sun = s; e.light = s.alt > 4;
    return e;
  }
  const rgba = c => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${c[3].toFixed(3)})`;

  let env = envFor(sunState());

  /* ---------- Letras ---------- */
  const chars = [], creativo = [];
  document.querySelectorAll('h1 .row').forEach((row, ri) => {
    const txt = row.textContent; row.textContent = '';
    [...txt].forEach((ch, i) => {
      const s = document.createElement('span');
      s.className = 'ch'; s.textContent = ch;
      if (ri === 1) creativo.push({ s, k: i / Math.max(1, txt.length - 1) });
      row.appendChild(s); chars.push(s);
    });
  });
  function paintText() {
    document.documentElement.classList.toggle('day', env.light);
    for (const { s } of creativo) s.style.color = '';   // mismo color que 'Hervidero', sin degradado
    document.querySelector('meta[name=theme-color]').content = rgba(env.sky[0]).replace(/rgba\((\d+),(\d+),(\d+).*/, (m, r, g, b) => '#' + [r, g, b].map(v => (+v).toString(16).padStart(2, '0')).join(''));
  }
  paintText();
  document.querySelectorAll('.fade').forEach(el => setTimeout(() => el.classList.add('on'), reduce ? 0 : +el.dataset.d || 0));

  /* ---------- Secretos y consejos ---------- */
  const SECRETS = ['agua', 'molino', 'quijote', 'castillo', 'cielo', 'clavileno'];
  const found = new Set();
  // el bingo solo vive en memoria: al recargar o cerrar empieza de cero (y se borra lo que guardaron versiones anteriores)
  try { localStorage.removeItem('hv-secretos'); } catch (e) {}
  try { sessionStorage.removeItem('hv-secretos'); } catch (e) {}
  const dotsEl = document.getElementById('dots'), countEl = document.getElementById('count'), countText = document.getElementById('countText');
  dotsEl.innerHTML = SECRETS.map(() => '<i></i>').join('');
  function renderCount() {
    [...dotsEl.children].forEach((d, i) => d.classList.toggle('on', i < found.size));
    countText.textContent = found.size === SECRETS.length ? '¡Bingo!' : `${found.size} de ${SECRETS.length} para bingo`;
  }
  renderCount();
  function discover(id) {
    if (found.has(id)) return;
    found.add(id);
    renderCount(); countEl.classList.remove('pulse'); void countEl.offsetWidth; countEl.classList.add('pulse');
    if (found.size === SECRETS.length) setTimeout(() => {
      say(W / 2, surf - 40, '¡Bingo! Los has encontrado todos. Escríbenos y seguimos jugando', 4.5);
      document.querySelector('.cta').classList.add('glow');
      for (let i = 0; i < 16; i++) addToken(W / 2 + rnd(-140, 140), surf - rnd(0, 90), ['★', '✦', '+1', '♥'][i % 4], true);
    }, 1400);
  }
  const tipEl = document.getElementById('tipText');
  function tips() {
    const s = env.sun, tap = touch ? 'Toca' : 'Pincha en';
    let now, other;
    if (s.isDay) { now = s.alt < 8 ? (s.morning ? 'amaneciendo' : 'atardeciendo') : 'de día'; other = 'de noche'; }
    else { now = s.alt > -8 ? (s.morning ? 'amaneciendo' : 'anocheciendo') : 'de noche'; other = 'de día'; }
    return [
      { id: null, t: `¿Sabías que esta web cambia con la hora real? Ahora está <b>${now}</b>: vuelve ${other} y verás otro paisaje.` },
      { id: 'agua', t: `${tap} el agua: cada manantial esconde algo distinto.` },
      { id: 'quijote', t: 'A veces alguien cabalga entre los molinos… ¿lo has visto?' },
      { id: 'molino', t: 'Los molinos también se dejan tocar.' },
      { id: 'cielo', t: `${s.isDay ? 'El sol' : 'La luna'} esconde una sorpresa.` },
      { id: 'castillo', t: 'El castillo guarda un secreto.' },
      { id: null, t: 'Busca los puntitos que laten: ahí pasa algo.' },
    ].filter(x => !x.id || !found.has(x.id));
  }
  let tipI = 0;
  function nextTip(first) {
    const L = tips(), t = L[tipI++ % L.length].t;
    if (first === true) { tipEl.innerHTML = t; return; }
    tipEl.classList.add('out');
    setTimeout(() => { tipEl.innerHTML = t; tipEl.classList.remove('out'); }, 600);
  }
  tipEl.innerHTML = `Busca los puntos que laten y ${touch ? 'tócalos' : 'haz clic'}: <b>¡a por el bingo!</b>`;

  /* ---------- Sprites ---------- */
  function radial(stops) {
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const s = c.getContext('2d'), g = s.createRadialGradient(64, 64, 0, 64, 64, 64);
    stops.forEach(([o, col]) => g.addColorStop(o, col)); s.fillStyle = g; s.fillRect(0, 0, 128, 128); return c;
  }
  const mist = radial([[0, 'rgba(255,238,220,1)'], [.5, 'rgba(255,238,220,.3)'], [1, 'rgba(255,238,220,0)']]);
  const mote = radial([[0, 'rgba(255,245,215,1)'], [.2, 'rgba(255,205,120,.75)'], [.55, 'rgba(255,170,80,.15)'], [1, 'rgba(255,170,80,0)']]);
  /* ---------- Iconos de los manantiales (genéricos, sin logos de marcas) ---------- */
  function rr(c, x, y, w, h, r) { c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
  const ICONS = {
    heart(c, s) { c.beginPath(); c.moveTo(0, s * .85); c.bezierCurveTo(-s * 1.15, s * .05, -s * .85, -s * 1, 0, -s * .35); c.bezierCurveTo(s * .85, -s * 1, s * 1.15, s * .05, 0, s * .85); c.fill(); },

    discover('clavileno');
    say(Q.x, groundY(Q.x) - 52 * S, '¡Agárrate, Sancho! Para ser memorables hay que subvertir las expectativas', 4.2);
    const k = S * 1.1;
    for (let i = 0; i < 9; i++) addToken(Q.x + rnd(-30, 30), groundY(Q.x) - rnd(10, 40), ['★', '✦', '+1'][i % 3], true);
    for (let i = 0; i < 45; i++) CV.sparks.push({ x: Q.x - Q.dir * 20 * k, y: groundY(Q.x) - 4, vx: rnd(-90, 90), vy: rnd(-40, 30), life: 0, max: rnd(.5, 1.2) });
  }
  function millHit(px, py) {
    for (const m of mills) { const hy = m.base - 39 * S; if (Math.hypot(px - m.x, py - hy) < 34 * S) return m; }
    return null;
  }
  function spinMill(m, words) {
    m.boost = 7;
    const hy = m.base - 39 * S;
    for (let i = 0; i < 6; i++) addToken(m.x + rnd(-20, 20), hy - rnd(0, 20), words[(Math.random() * words.length) | 0], true);
  }
  // Clavileño: el caballo de madera volador, con Don Quijote y Sancho con los ojos vendados
  const CV = { on: false, x: 0, y: 0, base: 0, t: 0, v: 0, climb: 0, next: Infinity, sparks: [] };
  function spawnClavileno() {
    CV.on = true; CV.t = 0; CV.climb = 0; CV.x = -70; CV.v = W < 700 ? 42 : 62;
    CV.base = surf * (W < 700 ? rnd(.1, .2) : rnd(.12, .3));
  }
  function clavHit(px, py) {
    if (!CV.on) return false; const k = S;
    return px > CV.x - 24 * k && px < CV.x + 24 * k && py > CV.y - 22 * k && py < CV.y + 14 * k;
  }
  function launchClavileno() {
    discover('clavileno'); CV.climb = 1;
    say(CV.x, CV.y - 26 * S, 'Lanzamientos que despegan', 2.4);
    for (let i = 0; i < 9; i++) addToken(CV.x + rnd(-30, 10), CV.y + rnd(-10, 10), ['★', '✦', '+1'][i % 3], true);
    for (let i = 0; i < 40; i++) CV.sparks.push({ x: CV.x - 16 * S, y: CV.y, vx: rnd(-140, 40), vy: rnd(-90, 90), life: 0, max: rnd(.5, 1.1) });
  }
  // estrella fugaz de noche
  let shoot = null, shootT = rnd(6, 14);
  function shootHit(px, py) {
    if (!shoot) return false;
    const hx = shoot.x, hy = shoot.y; return Math.hypot(px - hx, py - hy) < 40;
  }
  // bocadillos de diálogo
  function say(x, y, text, max, follow) { speech.length = 0; speech.push({ x, y, text, life: 0, max, follow }); }

  /* ---------- Superficie ---------- */
  const amb = x => { const a = 1 + 2.2 * boil; return Math.sin(x * .011 + T * 1.1) * a * .6 + Math.sin(x * .027 - T * 1.7) * a * .4; };
  const idx = x => clamp(Math.round(x / step), 0, N - 1);
  const surfAt = x => surf + hgt[idx(x)] + amb(x);
  function poke(x, f) { const i = idx(x); for (let k = -2; k <= 2; k++) { const j = i + k; if (j >= 0 && j < N) vel[j] += f * (1 - Math.abs(k) * .3); } }
  function waterStep() {
    for (let i = 0; i < N; i++) { vel[i] += -.025 * hgt[i] - .045 * vel[i]; hgt[i] += vel[i]; }
    for (let p = 0; p < 3; p++) for (let i = 1; i < N - 1; i++) vel[i] += .1 * (hgt[i - 1] + hgt[i + 1] - 2 * hgt[i]);
  }

  /* ---------- Partículas ---------- */
  function addBubble(x, y, r, g, col) {
    if (bubbles.length >= 420) return;
    bubbles.push({ x, y, r, vy: -rnd(8, 30), ph: rnd(0, 6.28), w: rnd(.5, 2), g, col });
  }
  function addToken(x, y, txt, big, col) {
    if (tokens.length < 80) tokens.push({ x, y, txt, col, vx: rnd(-30, 30), vy: -rnd(40, 90) * (big ? 1.4 : 1), life: 0, max: rnd(1.6, 2.4), size: big ? rnd(16, 24) : rnd(12, 15), rot: rnd(-.25, .25) });
  }
  function addSteam(x, y, big) {
    if (steam.length < 120) steam.push({ x, y, vx: rnd(-10, 4), vy: -rnd(8, 20), life: 0, max: rnd(3, 6), size: rnd(30, 60) * (big ? 1.5 : 1), seed: rnd(0, 6.28) });
  }
  function pop(b, sy) {
    poke(b.x, -b.r * .55);
    if (b.g) addToken(b.x, sy - 4, b.g, false, b.col);
    if (b.r > 3.6) for (let i = 0, n = Math.min(5, b.r / 2 | 0); i < n && drops.length < 240; i++)
      drops.push({ x: b.x, y: sy - 2, vx: rnd(-50, 50), vy: -rnd(70, 170) * (b.r / 7), r: rnd(.8, 1.8) });
    if (Math.random() < .08 + boil * .08) addSteam(b.x, sy, b.r > 5);
  }
  function geyser(x) {
    const sy = surfAt(x);
    for (let i = 0; i < 60 && drops.length < 320; i++)
      drops.push({ x: x + rnd(-5, 5), y: sy - 2, vx: rnd(-55, 55), vy: -rnd(200, 520), r: rnd(1, 2.8) });
    poke(x, -16);
    const by = bedAt(x);
    const th = vents.reduce((a, v) => Math.abs(v.x - x) < Math.abs(a.x - x) ? v : a).th;
    for (let i = 0; i < 26; i++) { if (i % 5 === 0) addBubble(x + rnd(-30, 30), by - rnd(0, 10), rnd(9, 11), pick(th.icons), th.col); else addBubble(x + rnd(-30, 30), by - rnd(0, 10), rnd(1.5, 5.5)); }
    for (let i = 0; i < 8; i++) grains.push({ x: x + rnd(-10, 10), y: by, vx: rnd(-40, 40), vy: -rnd(40, 110) });
    for (let i = 0; i < 4; i++) addSteam(x + rnd(-30, 30), sy - rnd(0, 40), true);
    for (let i = 0; i < 8; i++) addToken(x + rnd(-30, 30), sy - rnd(10, 60), pick(th.icons), true, th.col);
    burst = Math.min(1.4, burst + .8);
  }

  /* ---------- Interacción ---------- */
  function setPtr(e) { ptr.px = ptr.on ? ptr.x : e.clientX; ptr.py = ptr.on ? ptr.y : e.clientY; ptr.x = e.clientX; ptr.y = e.clientY; ptr.on = true; }
  back.addEventListener('pointermove', e => {
    setPtr(e);
    const X = e.clientX, Y = e.clientY;
    back.style.cursor = (clavHit(X, Y) || quijoteHit(X, Y) || millHit(X, Y) || shootHit(X, Y) || castleHit(X, Y) || skyHit(X, Y)) ? 'help' : 'pointer';
  });
  back.addEventListener('pointerleave', () => ptr.on = false);
  back.addEventListener('pointerup', () => { if (touch) ptr.on = false; });
  back.addEventListener('pointerdown', e => {
    setPtr(e);
    const x = e.clientX, y = e.clientY;
    if (clavHit(x, y)) { launchClavileno(); return; }
    if (quijoteHit(x, y)) { takeOff(); return; }
    const m = millHit(x, y);
    if (m) { discover('molino'); spinMill(m, ['+1', 'clic', '↑', '%', 'visitas', '+1']); say(m.x, m.base - 80 * S, 'Así se mueve una web con buen tráfico', 2.4); return; }
    if (shootHit(x, y)) {
      for (let i = 0; i < 8; i++) addToken(shoot.x + rnd(-20, 20), shoot.y + rnd(-10, 10), ['★', '✦', '+1', '♥'][i % 4], true);
      say(shoot.x, shoot.y - 16, 'Deseo concedido: más clientes ✦', 2.6); shoot = null; return;
    }
    if (castleHit(x, y)) {
      discover('castillo');
      say(castle.x, castle.box[1] - 9 * castle.u, 'Te has fijado en él, ¿verdad? Así debe ser tu marca: una insignia que se ve desde lejos', 4);
      for (let i = 0; i < 7; i++) addToken(castle.top.x + rnd(-20, 20), castle.box[1] - rnd(0, 20), ['★', '✦', '+1', '♥'][i % 4], true);
      return;
    }
    const sk = skyHit(x, y);
    if (sk) {
      discover('cielo'); skyPulse = 1;
      say(sk.x, sk.y - sk.r - 6, env.sun.isDay ? 'Que tu marca brille así' : 'Tu marca también vende de noche: 24/7', 2.4);
      for (let i = 0; i < 8; i++) addToken(sk.x + rnd(-25, 25), sk.y + rnd(-15, 15), ['✦', '★', '+1'][i % 3], true);
      return;
    }
    if (y > surfAt(x) - 30) discover('agua');
    geyser(x);
  });

  /* ---------- Bucle ---------- */
  const start = performance.now(); let last = start, simAcc = 0;
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now; T += dt;
    const t = (now - start) / 1000;
    const ramp = reduce ? .5 : Math.min(1, t / 2.8);
    burst *= Math.pow(.3, dt);
    boil = ramp * ramp * (3 - 2 * ramp) * (.9 + .1 * Math.sin(T * .4)) + burst * .6;
    const k = reduce ? .35 : 1;

    simAcc += dt; while (simAcc >= 1 / 60) { waterStep(); simAcc -= 1 / 60; }

    if (ptr.on && ptr.y > surfAt(ptr.x) - 40) {
      const sp = Math.hypot(ptr.x - ptr.px, ptr.y - ptr.py);
      if (sp > .5) poke(ptr.x, -Math.min(3.5, sp * .08));
      if (ptr.y > surfAt(ptr.x) && Math.random() < .25) addBubble(ptr.x + rnd(-6, 6), ptr.y, rnd(1, 2.5));
    }
    ptr.px = ptr.x; ptr.py = ptr.y;

    for (const v of vents) {
      const pulse = Math.pow(.5 + .5 * Math.sin(T * v.sp + v.ph), 3);
      v.p = pulse;
      v.acc += (7 + pulse * 50 + burst * 30) * boil * k * dt * (W < 700 ? 1 : 1.5);
      const by = bedAt(v.x);
      while (v.acc >= 1) { v.acc--;
        if (Math.random() < .16) addBubble(v.x + rnd(-9, 9), by - 2, rnd(9, 11), pick(v.th.icons), v.th.col);
        else addBubble(v.x + rnd(-9, 9), by - 2, rnd(1, 2 + 3.4 * pulse)); }
      v.gacc += pulse * 10 * boil * k * dt;
      while (v.gacc >= 1) { v.gacc--; if (grains.length < 220) grains.push({ x: v.x + rnd(-5, 5), y: by - 1, vx: rnd(-30, 30), vy: -rnd(20, 70) * (.5 + pulse) }); }
    }
    seepAcc += 16 * boil * k * (W / 1200) * dt;
    while (seepAcc >= 1) { seepAcc--; const x = rnd(0, W); addBubble(x, bedAt(x) - 2, rnd(.8, 1.8)); }
    sAcc += (1 + boil * 3) * (W / 1200) * k * dt;
    while (sAcc >= 1) { sAcc--; const x = rnd(0, W); addSteam(x, surfAt(x)); }

    for (let i = bubbles.length - 1; i >= 0; i--) {
      const b = bubbles[i];
      b.vy -= (24 + b.r * 13) * dt; b.vy *= .985; b.y += b.vy * dt;
      b.x += Math.sin(T * 3 * b.w + b.ph) * b.r * .1;
      b.r = Math.min(b.r * (1 + .1 * dt), b.g ? 15 : 9);
      const sy = surfAt(b.x);
      if (b.y - b.r * .3 <= sy) { pop(b, sy); bubbles.splice(i, 1); }
    }
    for (let i = drops.length - 1; i >= 0; i--) {
      const d = drops[i]; d.vy += 650 * dt; d.x += d.vx * dt; d.y += d.vy * dt;
      if (d.vy > 0 && d.y > surfAt(d.x)) { poke(d.x, 1.1 * d.r); drops.splice(i, 1); }
    }
    for (let i = grains.length - 1; i >= 0; i--) {
      const g = grains[i]; g.vy += 140 * dt; g.vx *= .97; g.x += g.vx * dt; g.y += g.vy * dt;
      if (g.vy > 0 && g.y >= bedAt(g.x)) grains.splice(i, 1);
    }
    for (let i = steam.length - 1; i >= 0; i--) {
      const s = steam[i]; s.life += dt;
      s.x += (s.vx + Math.sin(T * .5 + s.seed) * 6) * dt; s.y += s.vy * dt; s.vy *= (1 - .1 * dt); s.size += 18 * dt;
      if (s.life > s.max) steam.splice(i, 1);
    }
    for (let i = tokens.length - 1; i >= 0; i--) {
      const o = tokens[i]; o.life += dt; o.vy *= (1 - 1.2 * dt); o.vx *= (1 - 1.5 * dt);
      o.x += o.vx * dt; o.y += (o.vy - 14) * dt;
      if (o.life > o.max) tokens.splice(i, 1);
    }
    for (let i = speech.length - 1; i >= 0; i--) { speech[i].life += dt; if (speech[i].life > speech[i].max) speech.splice(i, 1); }

    leafT -= dt;
    if (leafT <= 0 && leaves.length < 6 && !reduce) {
      leafT = rnd(2.5, 5.5);
      leaves.push({ x: rnd(W * .1, W * .95), y: -20, vy: rnd(28, 46), ph: rnd(0, 6.28), rot: rnd(0, 6.28), rs: rnd(-2, 2),
        s: rnd(6, 10), hue: Math.random() < .5 ? rnd(0, 14) : rnd(30, 46), st: 0, t: 0 });
    }
    for (let i = leaves.length - 1; i >= 0; i--) {
      const l = leaves[i];
      if (!l.st) {
        l.y += l.vy * dt; l.x += (Math.sin(T * 1.4 + l.ph) * 34 - 8) * dt; l.rot += l.rs * dt;
        if (l.y >= surfAt(l.x) - 1) { l.st = 1; poke(l.x, 3); }
      } else {
        l.t += dt; l.x -= 9 * dt; l.y = surfAt(l.x) - 1; l.rot += Math.sin(T + l.ph) * .2 * dt;
        if (l.t > 12 || l.x < -30) leaves.splice(i, 1);
      }
    }
    for (const f of motes) {
      f.vx = clamp(f.vx + rnd(-1, 1) * 30 * dt, -12, 12); f.vy = clamp(f.vy + rnd(-1, 1) * 24 * dt, -9, 9);
      f.x += f.vx * dt; f.y += f.vy * dt;
      if (f.x < 0) f.x += W; if (f.x > W) f.x -= W;
      f.y = clamp(f.y, surf - H * .22, surf - 6);
    }
    flockT -= dt;
    if (!flock && flockT <= 0 && !reduce && env.stars < .8) {
      flock = { x: W + 60, y: surf * rnd(.18, .4), v: rnd(30, 42), n: W < 700 ? 7 : 9 };
    }
    if (flock) { flock.x -= flock.v * dt; if (flock.x < -260) { flock = null; flockT = rnd(14, 24); } }

    // molinos
    for (const m of mills) { m.boost *= Math.pow(.45, dt); m.ang += (m.sp * (1 + m.boost)) * dt; }
    skyPulse *= Math.pow(.35, dt);

    // Don Quijote y Sancho
    if (!Q.on) { Q.next -= dt; if (Q.next <= 0 && !reduce) spawnQuijote(); }
    else {
      const k2 = S * 1.1;
      if (Q.state === 'walk') { Q.x += Q.dir * 13 * k2 * dt; Q.phase += dt * 5; }
      else if (Q.state === 'fly') {
        Q.t += dt; Q.phase += dt * 10; Q.tilt = Math.min(.35, Q.t * .4);
        Q.lift += (22 + 55 * Q.t) * k2 * dt; Q.x += Q.dir * (14 + 16 * Q.t) * k2 * dt;
        if (Math.random() < .7) CV.sparks.push({ x: Q.x - Q.dir * 42 * k2, y: groundY(Q.x) - Q.lift - 8 * k2, vx: -Q.dir * rnd(20, 60), vy: rnd(10, 50), life: 0, max: rnd(.4, 1) });
        if (Q.t > 2.2 && mills.length) {
          const cand = mills.slice().sort((a, b) => Math.abs(a.x - Q.x) - Math.abs(b.x - Q.x));
          Q.target = cand.find(m => Math.abs(m.x - Q.x) > 50 * k2) || cand[0];
          Q.dir = Math.sign(Q.target.x - Q.x) || -1; Q.state = 'dive'; Q.t = 0;
        }
      } else if (Q.state === 'dive') {
        // amagan la embestida, despacio y con lanza en ristre...
        Q.t += dt; Q.phase += dt * 13; Q.tilt += (-.22 - Q.tilt) * Math.min(1, 3 * dt);
        const m = Q.target, hubY = m.base - 39 * S;
        Q.x += Q.dir * 55 * k2 * dt;
        Q.lift += ((groundY(Q.x) - hubY + 4 * k2) - Q.lift) * Math.min(1, 2.5 * dt) + Math.sin(Q.t * 7) * 6 * dt;
        if (Math.random() < .8) CV.sparks.push({ x: Q.x - Q.dir * 42 * k2, y: groundY(Q.x) - Q.lift - 8 * k2, vx: -Q.dir * rnd(30, 70), vy: rnd(-10, 40), life: 0, max: rnd(.4, .9) });
        if ((m.x - Q.x) * Q.dir < 42 * k2 || Q.t > 5) { Q.state = 'escape'; Q.t = 0; discover('quijote'); m.boost = 4; }
      } else if (Q.state === 'escape') {
        // ...y en el último momento viran al cielo y se esfuman
        Q.t += dt; Q.phase += dt * 18; Q.tilt += (.75 - Q.tilt) * Math.min(1, 4 * dt);
        Q.lift += (90 + 280 * Q.t) * k2 * dt; Q.x += Q.dir * (60 + 120 * Q.t) * k2 * dt;
        for (let i = 0; i < 2; i++) CV.sparks.push({ x: Q.x - Q.dir * 40 * k2, y: groundY(Q.x) - Q.lift - 6 * k2, vx: -Q.dir * rnd(40, 110), vy: rnd(20, 90), life: 0, max: rnd(.5, 1.2) });
        if (Q.t > 1.15 || groundY(Q.x) - Q.lift < 40) {
          const vx = clamp(Q.x, 40, W - 40), vy = Math.max(40, groundY(Q.x) - Q.lift - 10 * k2);
          for (let i = 0; i < 60; i++) { const an = rnd(0, 6.28), sp = rnd(30, 170); CV.sparks.push({ x: vx, y: vy, vx: Math.cos(an) * sp, vy: Math.sin(an) * sp, life: 0, max: rnd(.6, 1.4) }); }
          for (let i = 0; i < 8; i++) addToken(vx + rnd(-30, 30), vy + rnd(-20, 20), ['✦', '★', '✦', '+1'][i % 4], true);
          Q.on = false; Q.next = rnd(25, 40);
        }
      } else if (Q.state === 'fall') {
        Q.vy += 700 * dt; Q.lift -= Q.vy * dt; Q.x -= Q.dir * 25 * k2 * dt;
        Q.tumble = Math.min(1, Q.tumble + dt * 3); Q.tilt *= Math.pow(.1, dt);
        if (Q.lift <= 0) { Q.lift = 0; Q.tilt = 0; Q.state = 'hit'; Q.t = .5; poke(Q.x, 0); }
      } else if (Q.state === 'hit') {
        Q.t += dt; Q.tumble = 1;
        if (Q.t > 3.4) { Q.state = 'up'; Q.t = 0; }
      } else if (Q.state === 'up') {
        Q.t += dt; Q.tumble = Math.max(0, 1 - Q.t / .5);
        if (Q.t > .6) { Q.state = 'walk'; Q.dir = -1; }
      }
      if (Q.on && Q.state === 'walk' && (Q.x < crest.x - crest.w * 1.15 || Q.x < -60)) { Q.on = false; Q.next = rnd(25, 40); }
    }
    // Clavileño cruza el cielo cada cierto tiempo
    if (!CV.on) { CV.next -= dt; if (CV.next <= 0 && !reduce) spawnClavileno(); }
    else {
      CV.t += dt; CV.climb *= Math.pow(.6, dt);
      CV.x += CV.v * (1 + CV.climb * 2.2) * dt;
      CV.base -= CV.climb * 70 * dt;
      CV.y = CV.base + Math.sin(CV.t * 1.6) * 8 * S;
      if (Math.random() < .55) CV.sparks.push({ x: CV.x - 17 * S, y: CV.y + 1 * S, vx: rnd(-60, -20), vy: rnd(-12, 18), life: 0, max: rnd(.4, .9) });
      if (CV.x > W + 80 || CV.base < -40) { CV.on = false; CV.next = rnd(35, 55); }
    }
    for (let i = CV.sparks.length - 1; i >= 0; i--) { const p = CV.sparks[i]; p.life += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 40 * dt; if (p.life > p.max) CV.sparks.splice(i, 1); }
    // estrella fugaz (solo de noche)
    shootT -= dt;
    if (!shoot && shootT <= 0 && env.stars > .5) { shoot = { x: rnd(W * .2, W * .9), y: rnd(surf * .05, surf * .3), vx: -rnd(260, 380), vy: rnd(70, 120), life: 0 }; shootT = rnd(12, 22); }
    if (shoot) { shoot.life += dt; shoot.x += shoot.vx * dt; shoot.y += shoot.vy * dt; if (shoot.life > 1.6) shoot = null; }

    draw();
    letters(t);
    requestAnimationFrame(frame);
  }

  function surfacePath(ctx, cont) {
    ctx[cont ? 'lineTo' : 'moveTo'](0, surf + hgt[0] + amb(0));
    for (let i = 1; i < N; i++) { const x = i * step; ctx.lineTo(x, surf + hgt[i] + amb(x)); }
  }

  function drawSails(ctx, m) {
    const hub = { x: m.x, y: m.base - 36 * S - 3 * S }, L = 30 * S, wd = 6.5 * S;
    ctx.save(); ctx.translate(hub.x, hub.y);
    ctx.strokeStyle = rgba(env.sails); ctx.lineCap = 'round';
    for (let i = 0; i < 4; i++) {
      ctx.save(); ctx.rotate(m.ang + m.ph + i * Math.PI / 2);
      ctx.lineWidth = 1.6 * S; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(L, 0); ctx.stroke();
      ctx.lineWidth = .9 * S; ctx.beginPath();
      ctx.rect(L * .25, 0, L * .75, wd);
      for (let j = 1; j < 5; j++) { const xx = L * .25 + j * L * .75 / 5; ctx.moveTo(xx, 0); ctx.lineTo(xx, wd); }
      ctx.moveTo(L * .25, wd / 2); ctx.lineTo(L, wd / 2);
      ctx.stroke();
      ctx.restore();
    }
    ctx.fillStyle = rgba(env.sails); ctx.beginPath(); ctx.arc(0, 0, 2.2 * S, 0, 6.2832); ctx.fill();
    ctx.restore();
  }

  // Siluetas de Don Quijote (Rocinante, lanza) y Sancho (en su rucio). Diseñadas mirando a la derecha.
  function legs(ctx, k, xs, top, len, ph, amp) {
    xs.forEach((lx, i) => {
      const a = Math.sin(ph + (i % 2 ? Math.PI : 0) + (i > 1 ? .6 : 0)) * amp;
      ctx.beginPath(); ctx.moveTo(lx * k, top * k); ctx.lineTo(lx * k + Math.sin(a) * len * k, (top + Math.cos(a) * len) * k); ctx.stroke();
    });
  }
  function drawQuijote(ctx) {
    if (!Q.on) return;
    const k = S * 1.1, gy = groundY(Q.x), col = rgba(env.silh);
    ctx.save(); ctx.translate(Q.x, gy - (Q.lift || 0)); ctx.scale(Q.dir, 1); if (Q.tilt) ctx.rotate(-Q.tilt);
    ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const bob = Q.state === 'charge' ? Math.abs(Math.sin(Q.phase)) * 1.5 * k : Math.abs(Math.sin(Q.phase)) * .6 * k;

    // Sancho en el rucio (detrás)
    ctx.save(); ctx.translate(-30 * k, -bob * .6);
    ctx.lineWidth = 1.6 * k; legs(ctx, k, [-5, -3, 4, 6], -8, 8, Q.phase + 1, .3);
    ctx.beginPath(); ctx.ellipse(0, -10 * k, 8 * k, 3.6 * k, 0, 0, 6.2832); ctx.fill();
    ctx.lineWidth = 2.6 * k; ctx.beginPath(); ctx.moveTo(6 * k, -11 * k); ctx.lineTo(9 * k, -15 * k); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(10.5 * k, -15.5 * k, 3 * k, 1.8 * k, .4, 0, 6.2832); ctx.fill();
    ctx.lineWidth = 1.1 * k; ctx.beginPath(); ctx.moveTo(9 * k, -17 * k); ctx.lineTo(8 * k, -22 * k); ctx.moveTo(10 * k, -17 * k); ctx.lineTo(11 * k, -22 * k); ctx.stroke();
    ctx.lineWidth = 1.4 * k; ctx.beginPath(); ctx.moveTo(-8 * k, -11 * k); ctx.lineTo(-10 * k, -6 * k); ctx.stroke();
    ctx.beginPath(); ctx.arc(-.5 * k, -17 * k, 4.4 * k, 0, 6.2832); ctx.fill();               // Sancho, orondo
    ctx.beginPath(); ctx.arc(0, -23.5 * k, 2.4 * k, 0, 6.2832); ctx.fill();
    ctx.lineWidth = 1.2 * k; ctx.beginPath(); ctx.moveTo(-3.6 * k, -25 * k); ctx.lineTo(3.6 * k, -25 * k); ctx.stroke();
    ctx.restore();

    // Don Quijote sobre Rocinante
    ctx.save(); ctx.translate(0, -bob);
    ctx.rotate(-Q.tumble * .9);
    ctx.lineWidth = 1.7 * k; legs(ctx, k, [-8, -5, 6, 9], -11, 11, Q.phase, Q.state === 'charge' ? .55 : .32);
    ctx.beginPath(); ctx.ellipse(0, -13 * k, 11 * k, 4 * k, 0, 0, 6.2832); ctx.fill();               // Rocinante, flaco
    ctx.lineWidth = 3 * k; ctx.beginPath(); ctx.moveTo(8 * k, -15 * k); ctx.lineTo(13 * k, -23 * k); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(15.5 * k, -23.5 * k, 4.2 * k, 1.9 * k, .45, 0, 6.2832); ctx.fill();
    ctx.lineWidth = 1 * k; ctx.beginPath(); ctx.moveTo(13 * k, -25 * k); ctx.lineTo(13.5 * k, -28 * k); ctx.stroke();
    ctx.lineWidth = 1.5 * k; ctx.beginPath(); ctx.moveTo(-11 * k, -14 * k); ctx.quadraticCurveTo(-15 * k, -12 * k, -14 * k, -6 * k); ctx.stroke();
    // jinete
    ctx.save(); ctx.translate(0, -16 * k); ctx.rotate(-Q.tumble * .8); ctx.translate(0, 16 * k);
    ctx.lineWidth = 2.6 * k; ctx.beginPath(); ctx.moveTo(-1 * k, -17 * k); ctx.lineTo(0, -29 * k); ctx.stroke();      // torso enjuto
    ctx.lineWidth = 1.6 * k; ctx.beginPath(); ctx.moveTo(-1 * k, -17 * k); ctx.lineTo(2.5 * k, -11 * k); ctx.stroke();
    ctx.beginPath(); ctx.arc(.5 * k, -31.5 * k, 2.1 * k, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.ellipse(.5 * k, -33.6 * k, 3.4 * k, 1 * k, 0, Math.PI, 0); ctx.fill();                       // yelmo de Mambrino
    ctx.lineWidth = .9 * k; ctx.beginPath(); ctx.moveTo(1.5 * k, -30.5 * k); ctx.lineTo(2 * k, -27 * k); ctx.stroke();   // barba
    ctx.beginPath(); ctx.arc(-2.5 * k, -22 * k, 2.8 * k, 0, 6.2832); ctx.fill();                                       // adarga
    const lance = Q.state === 'charge' ? -.08 : -.32;
    ctx.save(); ctx.translate(.5 * k, -23 * k); ctx.rotate(lance);
    ctx.lineWidth = 1 * k; ctx.beginPath(); ctx.moveTo(-8 * k, 0); ctx.lineTo(28 * k, 0); ctx.stroke();
    ctx.restore();
    ctx.restore();
    ctx.restore();
    ctx.restore();

  }

  function drawClavileno(ctx) {
    const k = S, col = rgba(env.silh);
    ctx.save(); ctx.translate(CV.x, CV.y); ctx.rotate(Math.sin(CV.t * 1.6 + 1) * .05 - CV.climb * .35);
    ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    // caballo de madera, patas rígidas
    ctx.lineWidth = 1.8 * k; ctx.beginPath();
    ctx.moveTo(8 * k, 2 * k); ctx.lineTo(14 * k, 7 * k); ctx.moveTo(6 * k, 2 * k); ctx.lineTo(10 * k, 9 * k);
    ctx.moveTo(-8 * k, 2 * k); ctx.lineTo(-14 * k, 7 * k); ctx.moveTo(-6 * k, 2 * k); ctx.lineTo(-11 * k, 9 * k); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0, 0, 13 * k, 4.4 * k, 0, 0, 6.2832); ctx.fill();
    ctx.lineWidth = 3 * k; ctx.beginPath(); ctx.moveTo(9 * k, -2 * k); ctx.lineTo(13 * k, -9 * k); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(16 * k, -10 * k, 4.5 * k, 2.2 * k, .35, 0, 6.2832); ctx.fill();
    ctx.lineWidth = 1.2 * k; ctx.beginPath(); ctx.moveTo(14.5 * k, -12 * k); ctx.lineTo(14 * k, -15.5 * k); ctx.stroke();   // la clavija
    ctx.beginPath(); ctx.arc(14 * k, -16 * k, 1.1 * k, 0, 6.2832); ctx.fill();
    ctx.lineWidth = 1.6 * k; ctx.beginPath(); ctx.moveTo(-13 * k, -1 * k); ctx.lineTo(-17 * k, 1.5 * k); ctx.stroke();
    // Don Quijote delante, Sancho detrás
    ctx.lineWidth = 2.4 * k; ctx.beginPath(); ctx.moveTo(3 * k, -3 * k); ctx.lineTo(4 * k, -13 * k); ctx.stroke();
    ctx.lineWidth = 1.4 * k; ctx.beginPath(); ctx.moveTo(4 * k, -10 * k); ctx.lineTo(12 * k, -13 * k); ctx.stroke();
    ctx.beginPath(); ctx.arc(4.5 * k, -15.5 * k, 2 * k, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(-5 * k, -7 * k, 4 * k, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(-5 * k, -12.6 * k, 2.2 * k, 0, 6.2832); ctx.fill();
    // vendas en los ojos
    ctx.strokeStyle = env.light ? 'rgba(255,250,240,.95)' : 'rgba(255,230,200,.85)'; ctx.lineWidth = .9 * k;
    ctx.beginPath(); ctx.moveTo(2.6 * k, -16 * k); ctx.lineTo(6.6 * k, -16 * k); ctx.moveTo(-7.2 * k, -13 * k); ctx.lineTo(-2.8 * k, -13 * k); ctx.stroke();
    ctx.restore();
  }

  function draw() {
    const x = bx, e = env;
    sc.drawImage(bgC, 0, 0, W, surf + 2);
    for (const m of mills) drawSails(sc, m);
    drawFlag(sc);
    drawQuijote(sc);
    x.drawImage(scC, 0, 0, W, surf + 2);

    if (skyPulse > .02 && (sunDisc || moonPos)) {
      const d = sunDisc || moonPos, rr2 = d.r * (3 + 3 * (1 - skyPulse));
      const g = x.createRadialGradient(d.x, d.y, d.r * .8, d.x, d.y, rr2);
      g.addColorStop(0, `rgba(255,245,215,${.5 * skyPulse})`); g.addColorStop(1, 'rgba(255,245,215,0)');
      x.fillStyle = g; x.fillRect(d.x - rr2, d.y - rr2, rr2 * 2, rr2 * 2);
    }
    if (shoot) {
      const a = Math.sin(Math.PI * shoot.life / 1.6), len = 90;
      const g = x.createLinearGradient(shoot.x, shoot.y, shoot.x - shoot.vx / 300 * len, shoot.y - shoot.vy / 300 * len);
      g.addColorStop(0, `rgba(255,255,255,${a})`); g.addColorStop(1, 'rgba(255,255,255,0)');
      x.strokeStyle = g; x.lineWidth = 2; x.beginPath(); x.moveTo(shoot.x, shoot.y);
      x.lineTo(shoot.x - shoot.vx / 300 * len, shoot.y - shoot.vy / 300 * len); x.stroke();
    }

    // chispas de la cola de Clavileño (los cohetes del libro)
    if (CV.sparks.length) {
      x.globalCompositeOperation = 'lighter';
      for (const p of CV.sparks) { const a = 1 - p.life / p.max; x.fillStyle = `rgba(255,${150 + 80 * a | 0},70,${.85 * a})`; x.beginPath(); x.arc(p.x, p.y, 1.2 + 1.6 * a, 0, 6.2832); x.fill(); }
      x.globalCompositeOperation = 'source-over';
    }
    if (CV.on) drawClavileno(x);
    if (flock) {
      x.strokeStyle = rgba(e.bird); x.lineWidth = 1.4; x.lineCap = 'round';
      for (let i = 0; i < flock.n; i++) {
        const side = i % 2 ? 1 : -1, rank = Math.ceil(i / 2);
        const bxp = flock.x + rank * 20 * S, byp = flock.y + side * rank * 11 * S + Math.sin(T * .8 + i) * 2;
        const f = Math.sin(T * 5 + i * .7) * 4 * S, s = 7 * S;
        x.beginPath(); x.moveTo(bxp - s, byp - f); x.quadraticCurveTo(bxp - s * .4, byp - f * .3 - 2, bxp, byp);
        x.quadraticCurveTo(bxp + s * .4, byp - f * .3 - 2, bxp + s, byp - f); x.stroke();
      }
    }

    // agua
    x.save();
    x.beginPath(); x.moveTo(0, H); surfacePath(x, true); x.lineTo(W, H); x.closePath(); x.clip();
    const wg = x.createLinearGradient(0, surf, 0, H);
    wg.addColorStop(0, rgba(e.water[0])); wg.addColorStop(.25, rgba(e.water[1])); wg.addColorStop(.75, rgba(e.water[2])); wg.addColorStop(1, rgba(e.bed[1]));
    x.fillStyle = wg; x.fillRect(0, surf - 20, W, H - surf + 20);

    const refH = Math.min(H - surf, surf * .55), DH = 3;
    for (let y = 0; y < refH; y += DH) {
      const src = surf - y - DH; if (src < 0) break;
      x.globalAlpha = e.refl * (1 - y / refH);
      const off = Math.sin(y * .11 - T * 1.8) * (1 + y * .035) * (1 + boil * .6);
      x.drawImage(scC, 0, src * DPR, scC.width, DH * DPR, off, surf + y, W, DH);
    }
    x.globalAlpha = 1;

    x.globalCompositeOperation = 'lighter';
    const beamCol = e.light ? '255,255,235' : e.stars > .6 ? '150,170,230' : '255,200,130';
    for (const b of beams) {
      const a = (.03 + .018 * Math.sin(T * .6 + b.ph)) * (e.stars > .6 ? .5 : 1), bx0 = b.x + Math.sin(T * .2 + b.ph) * 30;
      const g = x.createLinearGradient(0, surf, 0, H); g.addColorStop(0, `rgba(${beamCol},${a})`); g.addColorStop(1, `rgba(${beamCol},0)`);
      x.fillStyle = g; x.beginPath();
      x.moveTo(bx0, surf); x.lineTo(bx0 + b.w, surf); x.lineTo(bx0 + b.w * 1.8 + b.sk, H); x.lineTo(bx0 + b.sk, H); x.closePath(); x.fill();
    }
    for (const v of vents) {
      const by = bedAt(v.x), r = 70 + 50 * (v.p || 0);
      const g = x.createRadialGradient(v.x, by, 0, v.x, by, r);
      g.addColorStop(0, `rgba(230,120,50,${.08 + .1 * (v.p || 0) * boil})`); g.addColorStop(1, 'rgba(230,120,50,0)');
      x.fillStyle = g; x.fillRect(v.x - r, by - r, r * 2, r * 2);
    }
    x.globalCompositeOperation = 'source-over';

    x.beginPath(); x.moveTo(0, H);
    for (let px = 0; px <= W + 8; px += 8) x.lineTo(px, bedAt(px));
    x.lineTo(W, H); x.closePath();
    const sg = x.createLinearGradient(0, surf + (H - surf) * .72, 0, H);
    sg.addColorStop(0, rgba(e.bed[0])); sg.addColorStop(1, rgba(e.bed[1]));
    x.fillStyle = sg; x.fill();
    const dark = e.stars;
    for (const p of pebbles) {
      x.beginPath(); x.ellipse(p.x, p.y, p.rx, p.ry, 0, 0, 6.2832);
      x.fillStyle = `hsl(${p.h},${30 - dark * 15}%,${p.l * (1 - dark * .6)}%)`; x.fill();
    }
    for (const v of vents) {
      const by = bedAt(v.x), w = 12 + 6 * (v.p || 0);
      const st = x.createRadialGradient(v.x, by, 0, v.x, by, w * 2.6);
      st.addColorStop(0, `rgba(235,130,40,${.55 * (1 - dark * .5)})`); st.addColorStop(1, 'rgba(235,130,40,0)');
      x.fillStyle = st; x.beginPath(); x.ellipse(v.x, by + 2, w * 2.6, 8, 0, 0, 6.2832); x.fill();
      x.beginPath(); x.ellipse(v.x, by + 1, w, 3.5, 0, 0, 6.2832); x.fillStyle = 'rgba(30,12,6,.8)'; x.fill();
    }
    x.fillStyle = 'rgba(225,140,70,.9)';
    for (const g of grains) x.fillRect(g.x, g.y, 1.6, 1.6);

    x.lineWidth = 1;
    for (const b of bubbles) {
      x.beginPath(); x.arc(b.x, b.y, b.r, 0, 6.2832);
      x.fillStyle = 'rgba(255,240,220,.07)'; x.fill();
      x.strokeStyle = 'rgba(255,244,228,.55)'; x.stroke();
      if (b.g) { x.fillStyle = 'rgba(10,20,30,.28)'; x.fill(); drawIcon(x, b.g, b.x, b.y, b.r * .58, b.col || '#ffd69a'); }
      else if (b.r > 2.4) { x.beginPath(); x.arc(b.x - b.r * .35, b.y - b.r * .38, b.r * .22, 0, 6.2832); x.fillStyle = 'rgba(255,255,255,.75)'; x.fill(); }
    }
    x.restore();

    x.beginPath(); surfacePath(x);
    x.strokeStyle = e.light ? 'rgba(255,255,255,.25)' : 'rgba(255,190,110,.18)'; x.lineWidth = 7; x.stroke();
    x.strokeStyle = 'rgba(255,240,215,.6)'; x.lineWidth = 1.3; x.stroke();

    x.fillStyle = 'rgba(240,248,250,.9)';
    for (const d of drops) { x.beginPath(); x.arc(d.x, d.y, d.r, 0, 6.2832); x.fill(); }

    for (const l of leaves) {
      const a = l.st ? clamp((12 - l.t) / 3, 0, 1) : 1;
      x.save(); x.translate(l.x, l.y); x.rotate(l.rot); x.globalAlpha = a;
      x.fillStyle = `hsl(${l.hue},75%,${(l.hue < 20 ? 40 : 48) * (1 - dark * .5)}%)`;
      x.beginPath();
      for (let j = 0; j < 5; j++) { const an = -Math.PI / 2 + (j - 2) * .62; x.ellipse(Math.cos(an) * l.s * .45, Math.sin(an) * l.s * .45, l.s * .5, l.s * .28, an, 0, 6.2832); }
      x.fill();
      x.restore();
    }
    x.globalAlpha = 1;

    // motas doradas al atardecer, luciérnagas de noche
    x.globalCompositeOperation = 'lighter';
    for (const f of motes) {
      const tw = .5 + .5 * Math.sin(T * 1.3 + f.ph);
      const am = (.35 + .35 * tw) * e.motes * Math.min(1, T / 3);
      if (am > .02) { x.globalAlpha = am; x.drawImage(mote, f.x - 7, f.y - 7, 14, 14); }
      const af = Math.pow(tw, 3) * e.flies * Math.min(1, T / 3);
      if (af > .02) { x.globalAlpha = af; x.drawImage(fly, f.x - 10, f.y - 10, 20, 20); }
    }
    x.globalAlpha = 1; x.globalCompositeOperation = 'source-over';

    for (const r of reeds) {
      const sw = Math.sin(T * r.sp + r.ph) * 6 + Math.sin(T * .37 + r.ph) * 3;
      const tx = r.x + r.lean + sw, ty = r.top, cx = r.x + r.lean * .4;
      x.beginPath();
      x.moveTo(r.x - r.w, H + 4);
      x.quadraticCurveTo(cx - r.w * .6, (ty + H) / 2, tx, ty);
      x.quadraticCurveTo(cx + r.w * .6, (ty + H) / 2, r.x + r.w, H + 4);
      x.closePath();
      const rc = e.reed; x.fillStyle = rgba([rc[0] * (r.shade > .5 ? .8 : 1.15), rc[1] * (r.shade > .5 ? .8 : 1.15), rc[2] * (r.shade > .5 ? .8 : 1.15), 1]); x.fill();
      if (r.tail) {
        x.save(); x.translate(tx - (r.lean + sw) * .04, ty + 16); x.rotate(Math.atan((r.lean + sw) / (H - ty)) * 1.4);
        x.beginPath(); x.ellipse(0, 0, 3.2, 11, 0, 0, 6.2832); x.fillStyle = e.light ? '#5a3418' : '#3a1a0e'; x.fill(); x.restore();
      }
    }

    // capa delantera: vapor, símbolos y bocadillos
    fx.clearRect(0, 0, W, H);
    for (const s of steam) {
      const a = Math.sin(Math.PI * s.life / s.max) * (.035 + .035 * Math.min(1, boil));
      if (a <= 0) continue;
      fx.globalAlpha = a; fx.drawImage(mist, s.x - s.size / 2, s.y - s.size / 2, s.size, s.size);
    }
    fx.globalAlpha = 1;
    fx.textAlign = 'center'; fx.textBaseline = 'middle';
    for (const o of tokens) {
      const kk = o.life / o.max, a = kk < .15 ? kk / .15 : 1 - (kk - .15) / .85;
      fx.save(); fx.translate(o.x, o.y); fx.rotate(o.rot); fx.globalAlpha = Math.max(0, a);
      fx.shadowColor = env.light ? 'rgba(30,20,40,.55)' : 'rgba(240,140,50,.7)'; fx.shadowBlur = 10;
      const col = o.col || (o.txt === '♥' ? '#ff8a6a' : '#ffd79a');
      if (ICONS[o.txt] || o.txt === 'code') drawIcon(fx, o.txt, 0, 0, o.size * .55, col);
      else { fx.font = `600 ${o.size}px ${FONT}`; fx.fillStyle = col; fx.fillText(o.txt, 0, 0); }
      fx.restore();
    }
    // puntitos que laten sobre lo que se puede tocar (desaparecen al descubrirlo)
    const ha = clamp((T - 4) / 2, 0, 1);
    if (ha > 0 && !reduce) {
      const c = env.light ? '194,85,26' : '255,215,154';
      const hot = (hx, hy, ph) => {
        const kk = (T * .8 + ph) % 1;
        fx.globalAlpha = ha;
        fx.beginPath(); fx.arc(hx, hy, 3 + kk * 11, 0, 6.2832); fx.strokeStyle = `rgba(${c},${(1 - kk) * .6})`; fx.lineWidth = 1.3; fx.stroke();
        fx.beginPath(); fx.arc(hx, hy, 2.6, 0, 6.2832); fx.fillStyle = `rgba(${c},.9)`; fx.fill();
      };
      if (!found.has('agua') && vents[1]) hot(vents[1].x, surfAt(vents[1].x) + 24, 0);
      if (!found.has('molino') && mills.length) { const m = mills[(mills.length - 1) >> 1]; hot(m.x, m.base - 39 * S, .25); }
      if ((!found.has('quijote') || !found.has('clavileno')) && Q.on && Q.state === 'walk') { const k3 = S * 1.1; hot(Q.x, groundY(Q.x) - 46 * k3, .5); }
      if (!found.has('castillo') && castle.top) hot(castle.top.x, castle.top.y - 6, .75);
      const d = sunDisc || moonPos;
      if (!found.has('cielo') && d) hot(d.x + d.r * .9, d.y - d.r * .9, .4);
      fx.globalAlpha = 1;
    }
    for (const b of speech) {
      if (b.follow === 'Q' && Q.on) { b.x = Q.x; b.y = groundY(Q.x) - (Q.lift || 0) - 50 * S; }
      const kk = b.life / b.max, a = kk < .1 ? kk / .1 : kk > .85 ? (1 - kk) / .15 : 1;
      fx.save(); fx.globalAlpha = a; fx.font = `600 13px ${FONT}`;
      const maxW = Math.min(300, W - 48), lines = [];
      for (const w of b.text.split(' ')) { const cur = lines[lines.length - 1]; if (cur && fx.measureText(cur + ' ' + w).width <= maxW) lines[lines.length - 1] = cur + ' ' + w; else lines.push(w); }
      const tw = Math.max(...lines.map(l => fx.measureText(l).width)), pw = tw + 22, ph = 10 + lines.length * 17;
      const bx0 = clamp(b.x - pw / 2, 8, W - pw - 8), above = b.y - ph - 8 >= 8, by0 = (above ? b.y - ph - 8 : b.y + 18) - (1 - Math.min(1, kk * 6)) * 6;
      fx.fillStyle = 'rgba(255,250,240,.96)'; fx.shadowColor = 'rgba(0,0,0,.25)'; fx.shadowBlur = 10;
      fx.beginPath(); fx.roundRect ? fx.roundRect(bx0, by0, pw, ph, 12) : fx.rect(bx0, by0, pw, ph); fx.fill();
      const tx = clamp(b.x, bx0 + 14, bx0 + pw - 14);
      fx.beginPath(); if (above) { fx.moveTo(tx - 6, by0 + ph - 1); fx.lineTo(tx, by0 + ph + 7); fx.lineTo(tx + 6, by0 + ph - 1); } else { fx.moveTo(tx - 6, by0 + 1); fx.lineTo(tx, by0 - 7); fx.lineTo(tx + 6, by0 + 1); } fx.fill();
      fx.shadowBlur = 0; fx.fillStyle = '#2a1a14';
      lines.forEach((l, i) => fx.fillText(l, bx0 + pw / 2, by0 + 13.5 + i * 17));
      fx.restore();
    }
  }

  function letters(t) {
    for (let i = 0; i < chars.length; i++) {
      const p = reduce ? 1 : clamp((t - .5 - i * .08) / 1.3, 0, 1);
      const e = 1 - Math.pow(1 - p, 3);
      const bob = reduce ? 0 : Math.sin(T * 1.3 + i * .5) * 2.2 * e;
      const y = (1 - e) * 60 + bob;
      const r = reduce ? 0 : Math.sin(T * 1.1 + i * .9) * .7 * e;
      const st = chars[i].style;
      st.transform = `translate3d(0,${y.toFixed(2)}px,0) rotate(${r.toFixed(2)}deg)`;
      st.opacity = Math.min(1, p * 1.5).toFixed(3);
      st.filter = p < 1 ? `blur(${((1 - e) * 10).toFixed(2)}px)` : 'none';
    }
  }

  if (params.has('debug')) window.__hv = { Q, CV, groundY, mills, spawnQuijote, castle, found, get castleNow() { return castle; }, get S() { return S; } };
  requestAnimationFrame(frame);
})();
</script>
</body>
