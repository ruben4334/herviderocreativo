<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hervidero Creativo</title>
<meta name="description" content="Hervidero Creativo, marketing digital desde La Mancha. Ideas que hierven, marcas que suben a la superficie. Muy pronto, nuestra web.">
<meta property="og:title" content="Hervidero Creativo">
<meta property="og:description" content="Marketing digital desde La Mancha. Ideas que hierven, marcas que suben a la superficie.">

<meta name="theme-color" content="#1b1430">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23e08a3c'/%3E%3Cpath d='M8 42c8-4 16 4 24 0s16-4 24 0v10H8z' fill='%232f5f5c'/%3E%3Ccircle cx='26' cy='30' r='5' fill='none' stroke='%23fbf1de' stroke-width='3.5'/%3E%3Ccircle cx='38' cy='20' r='3.5' fill='none' stroke='%23fbf1de' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script>document.documentElement.classList.add('js')</script>
<style>
  :root{
    --bg:#1b1430;
    --ink:#fbf1de;
    --muted:rgba(251,241,222,.74);
    --soft:rgba(251,241,222,.6);
    --accent:rgba(246,181,90,.9);
    --shade:rgba(20,8,20,.75);
    --cta-bg:rgba(27,20,48,.35);
    --cta-line:rgba(251,241,222,.3);
  }
  :root.day{
    --ink:#1c1626;
    --muted:rgba(28,22,38,.82);
    --soft:rgba(28,22,38,.7);
    --accent:rgba(190,80,20,.95);
    --shade:rgba(255,250,240,.75);
    --cta-bg:rgba(255,250,240,.45);
    --cta-line:rgba(28,22,38,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:'Instrument Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #back{z-index:1;cursor:pointer;touch-action:none}
  #front{z-index:3;pointer-events:none}

  .stage{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;
    padding:clamp(36px,9vh,104px) 16px 0;text-align:center;pointer-events:none}
  .kicker{margin:0;letter-spacing:.34em;text-transform:uppercase;font-size:12px;font-weight:500;color:var(--muted);
    text-shadow:0 1px 10px var(--shade)}
  h1{margin:.35em 0 .1em;line-height:.95;font-weight:600}
  h1 .row{display:block;white-space:nowrap}
  h1 .r1{font-weight:600;letter-spacing:-.04em;font-size:clamp(50px,12vw,150px);text-shadow:0 4px 30px var(--shade)}
  h1 .r2{font-weight:500;letter-spacing:-.035em;font-size:clamp(42px,10vw,124px);text-shadow:0 0 30px var(--shade)}
  h1 .ch{display:inline-block;will-change:transform,opacity;transition:color 2s}
  .tag{margin:.7em 0 0;font-size:clamp(16px,2vw,20px);line-height:1.5;color:var(--muted);max-width:36ch;
    text-shadow:0 1px 12px var(--shade)}
  .services{margin:.9em 0 0;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);
    text-shadow:0 1px 10px var(--shade);display:flex;flex-wrap:wrap;justify-content:center;gap:.25em .1em}
  .services span{white-space:nowrap}
  .services i{font-style:normal;color:var(--accent);margin:0 .35em}
  @media (max-width:420px){.services{font-size:10.5px;letter-spacing:.1em;max-width:30ch}.kicker{letter-spacing:.2em;font-size:11px}}

  .foot{position:fixed;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));z-index:4;
    display:flex;flex-direction:column;align-items:center;gap:12px;padding:0 16px;pointer-events:none}
  .cta{pointer-events:auto;color:var(--ink);text-decoration:none;font-size:14px;font-weight:500;letter-spacing:.02em;
    border:1px solid var(--cta-line);padding:11px 22px;border-radius:999px;
    background:var(--cta-bg);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    transition:background .25s,border-color .25s,transform .25s,color .25s}
  .cta:hover,.cta:focus-visible{background:rgba(236,160,70,.92);color:#2a1408;border-color:transparent;transform:translateY(-2px);outline:none}
  .small{text-align:center;line-height:1.7;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(251,241,222,.62);text-shadow:0 1px 8px rgba(0,0,0,.85)}
  .hint{position:fixed;z-index:4;left:50%;transform:translateX(-50%);font-size:12px;letter-spacing:.2em;
    text-transform:uppercase;color:rgba(251,241,222,.82);text-shadow:0 1px 10px rgba(0,0,0,.9);pointer-events:none;white-space:nowrap}

  .js .fade{opacity:0;transition:opacity 1.4s ease}
  .js .fade.on{opacity:1}
  .js h1 .ch{opacity:0}
  @media (prefers-reduced-motion:reduce){ .js .fade{transition:none} }
</style>
</head>
<body>
  <canvas id="back" aria-hidden="true"></canvas>

  <main class="stage">
    <p class="kicker fade" data-d="300">Marketing digital desde La Mancha</p>
    <h1 aria-label="Hervidero Creativo">
      <span class="row r1" aria-hidden="true">Hervidero</span>
      <span class="row r2" aria-hidden="true">Creativo</span>
    </h1>
    <p class="tag fade" data-d="2200">Ideas que hierven,<br>marcas que suben a la superficie.<br>Muy pronto, nuestra web.</p>
    <p class="services fade" data-d="2500"><span>SEO</span><i>·</i><span>Redes sociales</span><i>·</i><span>Publicidad digital</span><i>·</i><span>Contenidos</span></p>
  </main>

  <div class="hint fade" id="hint" data-d="4400">Haz clic en el agua</div>

  <footer class="foot">
    <a class="cta fade" data-d="2700" href="mailto:super@herviderocreativo.com">Escríbenos</a>
    <span class="small fade" data-d="3100">© 2026 Hervidero Creativo <span style="white-space:nowrap">· Castilla-La Mancha</span></span>
  </footer>

  <canvas id="front" aria-hidden="true"></canvas>

<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const touch = matchMedia('(hover: none)').matches;
  const params = new URLSearchParams(location.search);
  const back = document.getElementById('back'), bx = back.getContext('2d');
  const front = document.getElementById('front'), fx = front.getContext('2d');
  const bgC = document.createElement('canvas'), bg = bgC.getContext('2d');   // paisaje fijo
  const scC = document.createElement('canvas'), sc = scC.getContext('2d');   // paisaje + aspas + personajes (se refleja)
  const anchor = document.querySelector('.services');
  const hint = document.getElementById('hint');
  if (touch) hint.textContent = 'Toca el agua';
  const FONT = "'Instrument Sans',system-ui,sans-serif";

  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  function seeded(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const SEED = (Math.random() * 1e9) | 0;
  const oct = (fs, as) => fs.map((f, i) => ({ f, a: as[i], p: Math.random() * 6.28 }));
  const NZ = { far: oct([.0024, .0063, .017], [1, .4, .15]), bed: oct([.006, .017], [1, .4]) };
  const noise = (o, x) => o.reduce((s, k) => s + Math.sin(x * k.f + k.p) * k.a, 0);

  /* =====================================================================
     HORA REAL (Europe/Madrid) → altura del sol → paleta del paisaje
     Para previsualizar otra hora: ?hora=21.5
     ===================================================================== */
  function madridNow() {
    const forced = parseFloat(params.get('hora'));
    const d = new Date();
    const doy = Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 864e5);
    let h, off = 1;
    try {
      const p = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Madrid', hour: 'numeric', minute: 'numeric', hourCycle: 'h23', timeZoneName: 'shortOffset' }).formatToParts(d);
      const g = t => (p.find(x => x.type === t) || {}).value;
      h = +g('hour') + +g('minute') / 60;
      const m = /GMT([+-]\d+)/.exec(g('timeZoneName') || ''); off = m ? +m[1] : 1;
    } catch (e) { h = d.getHours() + d.getMinutes() / 60; }
    if (!isNaN(forced)) h = ((forced % 24) + 24) % 24;
    return { h, doy, off };
  }
  function sunState() {
    const { h, doy, off } = madridNow();
    const season = Math.sin(2 * Math.PI * (doy - 80) / 365);
    const dayLen = 12 + 2.75 * season;                 // ~9,3 h en invierno, ~14,7 h en verano (lat. ~39°)
    const noon = 12.25 + off;                          // mediodía solar aprox. en Ciudad Real (long. ~-3,9°)
    const rise = noon - dayLen / 2, set = noon + dayLen / 2;
    const maxAlt = 50.6 + 23.44 * season;
    let alt, p = 0, q = 0, isDay = h >= rise && h <= set;
    if (isDay) { p = (h - rise) / dayLen; alt = maxAlt * Math.sin(Math.PI * p); }
    else { const nl = 24 - dayLen; q = (((h - set) % 24) + 24) % 24 / nl; alt = -50 * Math.sin(Math.PI * q); }
    return { h, alt, p, q, isDay, morning: isDay ? p < .5 : q > .5 };
  }

  const C = (hex, a = 1) => { const n = parseInt(hex.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255, a]; };
  // fotogramas clave por altura del sol (grados)
  const KEYS = [
    { alt: -14, sky: [C('#050816'), C('#0b1430'), C('#141f46'), C('#1f2b55'), C('#2a3762')], far: C('#1e2850', .6), cones: C('#121830'), castle: C('#0c1024'),
      crest: C('#0e1327'), tower: C('#0b0f20'), cap: C('#070a17'), sails: C('#090c1b'), olive: C('#0b1021'), strip: C('#0a0e1d'), silh: C('#03050c'),
      water: [C('#1c2c46'), C('#101d31'), C('#0a1220')], bed: [C('#3a2416'), C('#120a06')], reed: C('#04060c'), cloud: C('#5a6496', .14), bird: C('#020308', .7),
      stars: 1, glow: 0, motes: 0, flies: 1, win: 1, rim: 0, refl: .45 },
    { alt: -5, sky: [C('#121636'), C('#2c2752'), C('#6a3e66'), C('#c86a5e'), C('#efa06a')], far: C('#5c3a62', .5), cones: C('#3e2440'), castle: C('#2a1630'),
      crest: C('#28162a'), tower: C('#20121f'), cap: C('#160a14'), sails: C('#170b14'), olive: C('#1d0f19'), strip: C('#1c0f18'), silh: C('#0e0610'),
      water: [C('#4a5568'), C('#24364a'), C('#162430')], bed: [C('#7a3e1e'), C('#24100a')], reed: C('#0d070b'), cloud: C('#c8708a', .2), bird: C('#120812', .8),
      stars: .55, glow: .7, motes: .4, flies: .4, win: .8, rim: .2, refl: .5 },
    { alt: 0, sky: [C('#1b1430'), C('#3b2547'), C('#8a3f45'), C('#e0793c'), C('#f6b55a')], far: C('#783c50', .5), cones: C('#5a2e3a'), castle: C('#3c1d28'),
      crest: C('#3a1f26'), tower: C('#2b161d'), cap: C('#1f0f15'), sails: C('#1e0e14'), olive: C('#26121a'), strip: C('#2a1419'), silh: C('#140a0e'),
      water: [C('#5a6f6a'), C('#2e4d4c'), C('#1d2f30')], bed: [C('#9a4e24'), C('#2e140b')], reed: C('#140a0c'), cloud: C('#ffaa6e', .25), bird: C('#1e0e18', .8),
      stars: .12, glow: 1, motes: 1, flies: 0, win: .4, rim: .35, refl: .55 },
    { alt: 7, sky: [C('#3a5c90'), C('#7690b4'), C('#d6a882'), C('#f0c07c'), C('#f8d59c')], far: C('#9a7a86', .5), cones: C('#8a5c42'), castle: C('#6a4838'),
      crest: C('#7a4f32'), tower: C('#e6d4ba'), cap: C('#3c2a26'), sails: C('#3a2822'), olive: C('#4a4628'), strip: C('#5a4630'), silh: C('#2a1a12'),
      water: [C('#6c8c8a'), C('#3e6466'), C('#24393c')], bed: [C('#a85a2a'), C('#341a0e')], reed: C('#1e1a10'), cloud: C('#fff0d8', .35), bird: C('#2a2024', .75),
      stars: 0, glow: .6, motes: .7, flies: 0, win: 0, rim: .25, refl: .5 },
    { alt: 22, sky: [C('#3d7cc6'), C('#5e9bd6'), C('#8dbde6'), C('#bcdaf0'), C('#e2eef2')], far: C('#7a94b4', .55), cones: C('#a47c50'), castle: C('#7c6a58'),
      crest: C('#b08856'), tower: C('#f5f1e8'), cap: C('#3e3230'), sails: C('#4a3a30'), olive: C('#56663a'), strip: C('#8a7a4a'), silh: C('#3a2618'),
      water: [C('#5ea4ac'), C('#2f7078'), C('#163a40')], bed: [C('#b0703a'), C('#3a2010')], reed: C('#22301a'), cloud: C('#ffffff', .55), bird: C('#2a2a30', .7),
      stars: 0, glow: .15, motes: 0, flies: 0, win: 0, rim: 0, refl: .45 },
  ];
  const mix = (a, b, t) => Array.isArray(a[0]) ? a.map((v, i) => mix(v, b[i], t)) : (typeof a === 'number' ? lerp(a, b, t) : a.map((v, i) => lerp(v, b[i], t)));
  function envFor(s) {
    const alt = clamp(s.alt, KEYS[0].alt, KEYS[KEYS.length - 1].alt);
    let i = 0; while (i < KEYS.length - 2 && alt > KEYS[i + 1].alt) i++;
    const A = KEYS[i], B = KEYS[i + 1], t = (alt - A.alt) / (B.alt - A.alt);
    const e = {};
    for (const k in A) if (k !== 'alt') e[k] = mix(A[k], B[k], t);
    e.alt = s.alt; e.sun = s; e.light = s.alt > 4;
    return e;
  }
  const rgba = c => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${c[3].toFixed(3)})`;

  let env = envFor(sunState());

  /* ---------- Letras ---------- */
  const chars = [], creativo = [];
  document.querySelectorAll('h1 .row').forEach((row, ri) => {
    const txt = row.textContent; row.textContent = '';
    [...txt].forEach((ch, i) => {
      const s = document.createElement('span');
      s.className = 'ch'; s.textContent = ch;
      if (ri === 1) creativo.push({ s, k: i / Math.max(1, txt.length - 1) });
      row.appendChild(s); chars.push(s);
    });
  });
  function paintText() {
    document.documentElement.classList.toggle('day', env.light);
    for (const { s, k } of creativo)
      s.style.color = env.light ? `hsl(${30 - k * 24},88%,${44 - k * 6}%)` : `hsl(${44 - k * 32},${88 - k * 8}%,${62 - k * 4}%)`;
    document.querySelector('meta[name=theme-color]').content = rgba(env.sky[0]).replace(/rgba\((\d+),(\d+),(\d+).*/, (m, r, g, b) => '#' + [r, g, b].map(v => (+v).toString(16).padStart(2, '0')).join(''));
  }
  paintText();
  document.querySelectorAll('.fade').forEach(el => setTimeout(() => el.classList.add('on'), reduce ? 0 : +el.dataset.d || 0));
  let hintGone = false;
  const killHint = () => { if (!hintGone) { hintGone = true; hint.classList.remove('on'); } };

  /* ---------- Sprites ---------- */
  function radial(stops) {
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const s = c.getContext('2d'), g = s.createRadialGradient(64, 64, 0, 64, 64, 64);
    stops.forEach(([o, col]) => g.addColorStop(o, col)); s.fillStyle = g; s.fillRect(0, 0, 128, 128); return c;
  }
  const mist = radial([[0, 'rgba(255,238,220,1)'], [.5, 'rgba(255,238,220,.3)'], [1, 'rgba(255,238,220,0)']]);
  const mote = radial([[0, 'rgba(255,245,215,1)'], [.2, 'rgba(255,205,120,.75)'], [.55, 'rgba(255,170,80,.15)'], [1, 'rgba(255,170,80,0)']]);
  const fly = radial([[0, 'rgba(250,255,210,1)'], [.18, 'rgba(210,245,120,.8)'], [.5, 'rgba(170,230,80,.18)'], [1, 'rgba(170,230,80,0)']]);

  /* ---------- Estado ---------- */
  let W = 0, H = 0, DPR = 1, surf = 0, step = 8, N = 0, hgt, vel, S = 1;
  let vents = [], pebbles = [], reeds = [], motes = [], beams = [], mills = [], stars = [];
  const bubbles = [], drops = [], grains = [], steam = [], leaves = [], tokens = [], speech = [];
  const GLYPHS = ['♥', '#', '@', '↑', '★', '♥', '↑'];
  const BURST = ['+1', '♥', '#', '↑', '★', '@', '+1', '♥', '%'];
  let flock = null, flockT = 3;
  let T = 0, boil = 0, burst = 0, sAcc = 0, seepAcc = 0, leafT = 2;
  const ptr = { x: -1, y: -1, px: -1, py: -1, on: false };

  const bedAt = x => surf + (H - surf) * .8 + noise(NZ.bed, x) * (H - surf) * .05;
  let cones = [], crest = null, castle = null;
  const gauss = (x, c, w) => Math.exp(-(((x - c) / w) ** 2));
  const coneH = x => cones.reduce((m, c) => Math.max(m, c.h * gauss(x, c.x, c.w)), 0);
  const crestH = x => crest.h * Math.exp(-(((x - crest.x) / crest.w) ** 4));

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    for (const [c, x] of [[back, bx], [front, fx]]) {
      c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); x.setTransform(DPR, 0, 0, DPR, 0, 0);
    }
    const tb = anchor.getBoundingClientRect().bottom;
    surf = Math.round(Math.min(H * .78, Math.max(H * .56, tb + 64)));
    step = W < 700 ? 6 : 8; N = Math.ceil(W / step) + 2;
    hgt = new Float32Array(N); vel = new Float32Array(N);
    const R = seeded(SEED), sm = W < 700;
    S = clamp(H / 900, .7, 1.15) * (sm ? .82 : 1);

    cones = [
      { x: W * (sm ? .72 : .58), w: W * (sm ? .16 : .09), h: H * .075 },
      { x: W * (sm ? .9 : .82), w: W * (sm ? .14 : .1), h: H * .095 },
      { x: W * (sm ? .48 : .43), w: W * (sm ? .1 : .06), h: H * .045 },
    ];
    crest = { x: W * (sm ? .18 : .2), w: W * (sm ? .26 : .17), h: H * .07 };
    castle = { x: cones[1].x };
    const nm = sm ? 2 : 4;
    mills = Array.from({ length: nm }, (_, i) => {
      const x = crest.x + (i - (nm - 1) / 2) * crest.w * (sm ? .62 : .42);
      return { x, base: surf - crestH(x) + 2, ph: R() * 6.28, sp: .28 + R() * .12, boost: 0, ang: R() * 6.28 };
    });
    stars = Array.from({ length: 110 }, () => ({ x: R() * W, y: R() * surf * .6, a: .2 + R() * .8, s: R() < .12 ? 1.7 : 1 }));

    const nv = sm ? 3 : 5;
    vents = Array.from({ length: nv }, (_, i) => ({
      x: (i + .5 + (R() - .5) * .5) / nv * W, sp: .6 + R() * .9, ph: R() * 6.28, acc: 0, gacc: 0 }));
    pebbles = Array.from({ length: Math.round(W / 22) }, () => {
      const x = R() * W, r = 2 + R() * 6; return { x, y: bedAt(x) + 3 + R() * 22, rx: r, ry: r * (.5 + R() * .2), l: 20 + R() * 18, h: 14 + R() * 18 }; });
    reeds = [];
    const nr = sm ? 6 : 13;
    for (const side of [0, 1]) for (let i = 0; i < nr; i++) {
      const x = side ? W - R() * W * .1 + 6 : R() * W * .1 - 6;
      reeds.push({ x, top: surf - (25 + R() * (sm ? 80 : 130)), w: 2.5 + R() * 3.5, lean: (side ? -1 : 1) * (4 + R() * 26),
        ph: R() * 6.28, sp: .7 + R() * .6, tail: R() < .35, shade: R() });
    }
    motes = Array.from({ length: sm ? 12 : 22 }, () => ({ x: R() * W, y: surf - 6 - R() * H * .2, vx: 0, vy: 0, ph: R() * 6.28 }));
    beams = Array.from({ length: sm ? 2 : 4 }, () => ({ x: R() * W, w: 40 + R() * 90, sk: -60 - R() * 120, ph: R() * 6.28 }));
    buildBg();
    hint.style.top = Math.min(H - 120, surf + (H - surf) * .42) + 'px';
  }

  /* Paisaje fijo, pintado con la paleta de la hora */
  function sunPos() {
    const s = env.sun;
    if (s.isDay) return { x: W * (.08 + .84 * s.p), y: surf - Math.max(0, s.alt) / 50 * surf * .9 - H * .01, up: true };
    return { x: s.morning ? W * .08 : W * .92, y: surf + 30, up: false };
  }
  function buildBg() {
    const e = env;
    bgC.width = Math.round(W * DPR); bgC.height = Math.round((surf + 2) * DPR);
    bg.setTransform(DPR, 0, 0, DPR, 0, 0);
    const sky = bg.createLinearGradient(0, 0, 0, surf);
    [0, .35, .62, .85, 1].forEach((o, i) => sky.addColorStop(o, rgba(e.sky[i])));
    bg.fillStyle = sky; bg.fillRect(0, 0, W, surf + 2);

    if (e.stars > .01) {
      bg.fillStyle = '#fff';
      for (const st of stars) { bg.globalAlpha = st.a * e.stars * (1 - st.y / (surf * .6)) ; bg.fillRect(st.x, st.y, st.s, st.s); }
      bg.globalAlpha = 1;
    }
    // luna de noche

  /* ---------- Interacción ---------- */

    shootT -= dt;
    if (!shoot && shootT <= 0 && env.stars > .5) { shoot = { x: rnd(W * .2, W * .9), y: rnd(surf * .05, surf * .3), vx: -rnd(260, 380), vy: rnd(70, 120), life: 0 }; shootT = rnd(12, 22); }
    if (shoot) { shoot.life += dt; shoot.x += shoot.vx * dt; shoot.y += shoot.vy * dt; if (shoot.life > 1.6) shoot = null; }

    draw();
    letters(t);
    requestAnimationFrame(frame);
  }

  function surfacePath(ctx, cont) {
    ctx[cont ? 'lineTo' : 'moveTo'](0, surf + hgt[0] + amb(0));
    for (let i = 1; i < N; i++) { const x = i * step; ctx.lineTo(x, surf + hgt[i] + amb(x)); }
  }

  function drawSails(ctx, m) {
    const hub = { x: m.x, y: m.base - 36 * S - 3 * S }, L = 30 * S, wd = 6.5 * S;
    ctx.save(); ctx.translate(hub.x, hub.y);
    ctx.strokeStyle = rgba(env.sails); ctx.lineCap = 'round';
    for (let i = 0; i < 4; i++) {
      ctx.save(); ctx.rotate(m.ang + m.ph + i * Math.PI / 2);
      ctx.lineWidth = 1.6 * S; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(L, 0); ctx.stroke();
      ctx.lineWidth = .9 * S; ctx.beginPath();
      ctx.rect(L * .25, 0, L * .75, wd);
      for (let j = 1; j < 5; j++) { const xx = L * .25 + j * L * .75 / 5; ctx.moveTo(xx, 0); ctx.lineTo(xx, wd); }
      ctx.moveTo(L * .25, wd / 2); ctx.lineTo(L, wd / 2);
      ctx.stroke();
      ctx.restore();
    }
    ctx.fillStyle = rgba(env.sails); ctx.beginPath(); ctx.arc(0, 0, 2.2 * S, 0, 6.2832); ctx.fill();
    ctx.restore();
  }

  // Siluetas de Don Quijote (Rocinante, lanza) y Sancho (en su rucio). Diseñadas mirando a la derecha.
  function legs(ctx, k, xs, top, len, ph, amp) {
    xs.forEach((lx, i) => {
      const a = Math.sin(ph + (i % 2 ? Math.PI : 0) + (i > 1 ? .6 : 0)) * amp;
      ctx.beginPath(); ctx.moveTo(lx * k, top * k); ctx.lineTo(lx * k + Math.sin(a) * len * k, (top + Math.cos(a) * len) * k); ctx.stroke();
    });
  }
  function drawQuijote(ctx) {
    if (!Q.on) return;
    const k = S * 1.1, gy = groundY(Q.x), col = rgba(env.silh);
    ctx.save(); ctx.translate(Q.x, gy); ctx.scale(Q.dir, 1);
    ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const bob = Q.state === 'charge' ? Math.abs(Math.sin(Q.phase)) * 1.5 * k : Math.abs(Math.sin(Q.phase)) * .6 * k;

    // Sancho en el rucio (detrás)
    ctx.save(); ctx.translate(-30 * k, -bob * .6);
    ctx.lineWidth = 1.6 * k; legs(ctx, k, [-5, -3, 4, 6], -8, 8, Q.phase + 1, .3);
    ctx.beginPath(); ctx.ellipse(0, -10 * k, 8 * k, 3.6 * k, 0, 0, 6.2832); ctx.fill();
    ctx.lineWidth = 2.6 * k; ctx.beginPath(); ctx.moveTo(6 * k, -11 * k); ctx.lineTo(9 * k, -15 * k); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(10.5 * k, -15.5 * k, 3 * k, 1.8 * k, .4, 0, 6.2832); ctx.fill();
    ctx.lineWidth = 1.1 * k; ctx.beginPath(); ctx.moveTo(9 * k, -17 * k); ctx.lineTo(8 * k, -22 * k); ctx.moveTo(10 * k, -17 * k); ctx.lineTo(11 * k, -22 * k); ctx.stroke();
    ctx.lineWidth = 1.4 * k; ctx.beginPath(); ctx.moveTo(-8 * k, -11 * k); ctx.lineTo(-10 * k, -6 * k); ctx.stroke();
    ctx.beginPath(); ctx.arc(-.5 * k, -17 * k, 4.4 * k, 0, 6.2832); ctx.fill();               // Sancho, orondo
    ctx.beginPath(); ctx.arc(0, -23.5 * k, 2.4 * k, 0, 6.2832); ctx.fill();
    ctx.lineWidth = 1.2 * k; ctx.beginPath(); ctx.moveTo(-3.6 * k, -25 * k); ctx.lineTo(3.6 * k, -25 * k); ctx.stroke();
    ctx.restore();

    // Don Quijote sobre Rocinante
    ctx.save(); ctx.translate(0, -bob);
    ctx.rotate(-Q.tumble * .9);
    ctx.lineWidth = 1.7 * k; legs(ctx, k, [-8, -5, 6, 9], -11, 11, Q.phase, Q.state === 'charge' ? .55 : .32);
    ctx.beginPath(); ctx.ellipse(0, -13 * k, 11 * k, 4 * k, 0, 0, 6.2832); ctx.fill();               // Rocinante, flaco
    ctx.lineWidth = 3 * k; ctx.beginPath(); ctx.moveTo(8 * k, -15 * k); ctx.lineTo(13 * k, -23 * k); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(15.5 * k, -23.5 * k, 4.2 * k, 1.9 * k, .45, 0, 6.2832); ctx.fill();
    ctx.lineWidth = 1 * k; ctx.beginPath(); ctx.moveTo(13 * k, -25 * k); ctx.lineTo(13.5 * k, -28 * k); ctx.stroke();
    ctx.lineWidth = 1.5 * k; ctx.beginPath(); ctx.moveTo(-11 * k, -14 * k); ctx.quadraticCurveTo(-15 * k, -12 * k, -14 * k, -6 * k); ctx.stroke();
    // jinete
    ctx.save(); ctx.translate(0, -16 * k); ctx.rotate(-Q.tumble * .8); ctx.translate(0, 16 * k);
    ctx.lineWidth = 2.6 * k; ctx.beginPath(); ctx.moveTo(-1 * k, -17 * k); ctx.lineTo(0, -29 * k); ctx.stroke();      // torso enjuto
    ctx.lineWidth = 1.6 * k; ctx.beginPath(); ctx.moveTo(-1 * k, -17 * k); ctx.lineTo(2.5 * k, -11 * k); ctx.stroke();
    ctx.beginPath(); ctx.arc(.5 * k, -31.5 * k, 2.1 * k, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.ellipse(.5 * k, -33.6 * k, 3.4 * k, 1 * k, 0, Math.PI, 0); ctx.fill();                       // yelmo de Mambrino
    ctx.lineWidth = .9 * k; ctx.beginPath(); ctx.moveTo(1.5 * k, -30.5 * k); ctx.lineTo(2 * k, -27 * k); ctx.stroke();   // barba
    ctx.beginPath(); ctx.arc(-2.5 * k, -22 * k, 2.8 * k, 0, 6.2832); ctx.fill();                                       // adarga
    const lance = Q.state === 'charge' ? -.08 : -.32;
    ctx.save(); ctx.translate(.5 * k, -23 * k); ctx.rotate(lance);
    ctx.lineWidth = 1 * k; ctx.beginPath(); ctx.moveTo(-8 * k, 0); ctx.lineTo(28 * k, 0); ctx.stroke();
    ctx.restore();
    ctx.restore();
    ctx.restore();
    ctx.restore();

    // destello para invitar al clic
    if (Q.state === 'walk') {
      const a = .5 + .5 * Math.sin(T * 4);
      ctx.save(); ctx.globalAlpha = .35 + .5 * a; ctx.fillStyle = env.light ? '#c2551a' : '#ffd79a';
      ctx.font = `600 ${(10 * k).toFixed(1)}px ${FONT}`; ctx.textAlign = 'center';
      ctx.fillText('✦', Q.x + 2 * k * Q.dir, gy - 44 * k - a * 2);
      ctx.restore();
    }
  }

  function draw() {
    const x = bx, e = env;
    sc.drawImage(bgC, 0, 0, W, surf + 2);
    for (const m of mills) drawSails(sc, m);
    drawQuijote(sc);
    x.drawImage(scC, 0, 0, W, surf + 2);

    if (W >= 900 && mills.length) {
      const mx = (mills[0].x + mills[mills.length - 1].x) / 2, my = Math.min(...mills.map(m => m.base)) - 66 * S;
      x.save(); x.globalAlpha = Math.min(1, Math.max(0, (T - 3.5) / 1.5)) * .85;
      x.font = `500 13px ${FONT}`; x.textAlign = 'center'; x.fillStyle = e.light ? '#2a1a14' : '#fbe6c4';
      x.shadowColor = e.light ? 'rgba(255,250,240,.8)' : 'rgba(30,10,20,.8)'; x.shadowBlur = 8;
      x.fillText('convertimos el viento en tráfico', mx, my); x.restore();
    }

    if (shoot) {
      const a = Math.sin(Math.PI * shoot.life / 1.6), len = 90;
      const g = x.createLinearGradient(shoot.x, shoot.y, shoot.x - shoot.vx / 300 * len, shoot.y - shoot.vy / 300 * len);
      g.addColorStop(0, `rgba(255,255,255,${a})`); g.addColorStop(1, 'rgba(255,255,255,0)');
      x.strokeStyle = g; x.lineWidth = 2; x.beginPath(); x.moveTo(shoot.x, shoot.y);
      x.lineTo(shoot.x - shoot.vx / 300 * len, shoot.y - shoot.vy / 300 * len); x.stroke();
    }

    if (flock) {
      x.strokeStyle = rgba(e.bird); x.lineWidth = 1.4; x.lineCap = 'round';
      for (let i = 0; i < flock.n; i++) {
        const side = i % 2 ? 1 : -1, rank = Math.ceil(i / 2);
        const bxp = flock.x + rank * 20 * S, byp = flock.y + side * rank * 11 * S + Math.sin(T * .8 + i) * 2;
        const f = Math.sin(T * 5 + i * .7) * 4 * S, s = 7 * S;
        x.beginPath(); x.moveTo(bxp - s, byp - f); x.quadraticCurveTo(bxp - s * .4, byp - f * .3 - 2, bxp, byp);
        x.quadraticCurveTo(bxp + s * .4, byp - f * .3 - 2, bxp + s, byp - f); x.stroke();
      }
    }

    // agua
    x.save();
    x.beginPath(); x.moveTo(0, H); surfacePath(x, true); x.lineTo(W, H); x.closePath(); x.clip();
    const wg = x.createLinearGradient(0, surf, 0, H);
    wg.addColorStop(0, rgba(e.water[0])); wg.addColorStop(.25, rgba(e.water[1])); wg.addColorStop(.75, rgba(e.water[2])); wg.addColorStop(1, rgba(e.bed[1]));
    x.fillStyle = wg; x.fillRect(0, surf - 20, W, H - surf + 20);

    const refH = Math.min(H - surf, surf * .55), DH = 3;
    for (let y = 0; y < refH; y += DH) {
      const src = surf - y - DH; if (src < 0) break;
      x.globalAlpha = e.refl * (1 - y / refH);
      const off = Math.sin(y * .11 - T * 1.8) * (1 + y * .035) * (1 + boil * .6);
      x.drawImage(scC, 0, src * DPR, scC.width, DH * DPR, off, surf + y, W, DH);
    }
    x.globalAlpha = 1;

    x.globalCompositeOperation = 'lighter';
    const beamCol = e.light ? '255,255,235' : e.stars > .6 ? '150,170,230' : '255,200,130';
    for (const b of beams) {
      const a = (.03 + .018 * Math.sin(T * .6 + b.ph)) * (e.stars > .6 ? .5 : 1), bx0 = b.x + Math.sin(T * .2 + b.ph) * 30;
      const g = x.createLinearGradient(0, surf, 0, H); g.addColorStop(0, `rgba(${beamCol},${a})`); g.addColorStop(1, `rgba(${beamCol},0)`);
      x.fillStyle = g; x.beginPath();
      x.moveTo(bx0, surf); x.lineTo(bx0 + b.w, surf); x.lineTo(bx0 + b.w * 1.8 + b.sk, H); x.lineTo(bx0 + b.sk, H); x.closePath(); x.fill();
    }
    for (const v of vents) {
      const by = bedAt(v.x), r = 70 + 50 * (v.p || 0);
      const g = x.createRadialGradient(v.x, by, 0, v.x, by, r);
      g.addColorStop(0, `rgba(230,120,50,${.08 + .1 * (v.p || 0) * boil})`); g.addColorStop(1, 'rgba(230,120,50,0)');
      x.fillStyle = g; x.fillRect(v.x - r, by - r, r * 2, r * 2);
    }
    x.globalCompositeOperation = 'source-over';

    x.beginPath(); x.moveTo(0, H);
    for (let px = 0; px <= W + 8; px += 8) x.lineTo(px, bedAt(px));
    x.lineTo(W, H); x.closePath();
    const sg = x.createLinearGradient(0, surf + (H - surf) * .72, 0, H);
    sg.addColorStop(0, rgba(e.bed[0])); sg.addColorStop(1, rgba(e.bed[1]));
    x.fillStyle = sg; x.fill();
    const dark = e.stars;
    for (const p of pebbles) {
      x.beginPath(); x.ellipse(p.x, p.y, p.rx, p.ry, 0, 0, 6.2832);
      x.fillStyle = `hsl(${p.h},${30 - dark * 15}%,${p.l * (1 - dark * .6)}%)`; x.fill();
    }
    for (const v of vents) {
      const by = bedAt(v.x), w = 12 + 6 * (v.p || 0);
      const st = x.createRadialGradient(v.x, by, 0, v.x, by, w * 2.6);
      st.addColorStop(0, `rgba(235,130,40,${.55 * (1 - dark * .5)})`); st.addColorStop(1, 'rgba(235,130,40,0)');
      x.fillStyle = st; x.beginPath(); x.ellipse(v.x, by + 2, w * 2.6, 8, 0, 0, 6.2832); x.fill();
      x.beginPath(); x.ellipse(v.x, by + 1, w, 3.5, 0, 0, 6.2832); x.fillStyle = 'rgba(30,12,6,.8)'; x.fill();
    }
    x.fillStyle = 'rgba(225,140,70,.9)';
    for (const g of grains) x.fillRect(g.x, g.y, 1.6, 1.6);

    x.lineWidth = 1;
    for (const b of bubbles) {
      x.beginPath(); x.arc(b.x, b.y, b.r, 0, 6.2832);
      x.fillStyle = 'rgba(255,240,220,.07)'; x.fill();
      x.strokeStyle = 'rgba(255,244,228,.55)'; x.stroke();
      if (b.g) {
        x.fillStyle = 'rgba(255,214,150,.95)'; x.font = `600 ${(b.r * 1.15).toFixed(1)}px ${FONT}`;
        x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(b.g, b.x, b.y + b.r * .05);
      } else if (b.r > 2.4) { x.beginPath(); x.arc(b.x - b.r * .35, b.y - b.r * .38, b.r * .22, 0, 6.2832); x.fillStyle = 'rgba(255,255,255,.75)'; x.fill(); }
    }
    x.restore();

    x.beginPath(); surfacePath(x);
    x.strokeStyle = e.light ? 'rgba(255,255,255,.25)' : 'rgba(255,190,110,.18)'; x.lineWidth = 7; x.stroke();
    x.strokeStyle = 'rgba(255,240,215,.6)'; x.lineWidth = 1.3; x.stroke();

    x.fillStyle = 'rgba(240,248,250,.9)';
    for (const d of drops) { x.beginPath(); x.arc(d.x, d.y, d.r, 0, 6.2832); x.fill(); }

    for (const l of leaves) {
      const a = l.st ? clamp((12 - l.t) / 3, 0, 1) : 1;
      x.save(); x.translate(l.x, l.y); x.rotate(l.rot); x.globalAlpha = a;
      x.fillStyle = `hsl(${l.hue},75%,${(l.hue < 20 ? 40 : 48) * (1 - dark * .5)}%)`;
      x.beginPath();
      for (let j = 0; j < 5; j++) { const an = -Math.PI / 2 + (j - 2) * .62; x.ellipse(Math.cos(an) * l.s * .45, Math.sin(an) * l.s * .45, l.s * .5, l.s * .28, an, 0, 6.2832); }
      x.fill();
      x.restore();
    }
    x.globalAlpha = 1;

    // motas doradas al atardecer, luciérnagas de noche
    x.globalCompositeOperation = 'lighter';
    for (const f of motes) {
      const tw = .5 + .5 * Math.sin(T * 1.3 + f.ph);
      const am = (.35 + .35 * tw) * e.motes * Math.min(1, T / 3);
      if (am > .02) { x.globalAlpha = am; x.drawImage(mote, f.x - 7, f.y - 7, 14, 14); }
      const af = Math.pow(tw, 3) * e.flies * Math.min(1, T / 3);
      if (af > .02) { x.globalAlpha = af; x.drawImage(fly, f.x - 10, f.y - 10, 20, 20); }
    }
    x.globalAlpha = 1; x.globalCompositeOperation = 'source-over';

    for (const r of reeds) {
      const sw = Math.sin(T * r.sp + r.ph) * 6 + Math.sin(T * .37 + r.ph) * 3;
      const tx = r.x + r.lean + sw, ty = r.top, cx = r.x + r.lean * .4;
      x.beginPath();
      x.moveTo(r.x - r.w, H + 4);
      x.quadraticCurveTo(cx - r.w * .6, (ty + H) / 2, tx, ty);
      x.quadraticCurveTo(cx + r.w * .6, (ty + H) / 2, r.x + r.w, H + 4);
      x.closePath();
      const rc = e.reed; x.fillStyle = rgba([rc[0] * (r.shade > .5 ? .8 : 1.15), rc[1] * (r.shade > .5 ? .8 : 1.15), rc[2] * (r.shade > .5 ? .8 : 1.15), 1]); x.fill();
      if (r.tail) {
        x.save(); x.translate(tx - (r.lean + sw) * .04, ty + 16); x.rotate(Math.atan((r.lean + sw) / (H - ty)) * 1.4);
        x.beginPath(); x.ellipse(0, 0, 3.2, 11, 0, 0, 6.2832); x.fillStyle = e.light ? '#5a3418' : '#3a1a0e'; x.fill(); x.restore();
      }
    }

    // capa delantera: vapor, símbolos y bocadillos
    fx.clearRect(0, 0, W, H);
    for (const s of steam) {
      const a = Math.sin(Math.PI * s.life / s.max) * (.035 + .035 * Math.min(1, boil));
      if (a <= 0) continue;
      fx.globalAlpha = a; fx.drawImage(mist, s.x - s.size / 2, s.y - s.size / 2, s.size, s.size);
    }
    fx.globalAlpha = 1;
    fx.textAlign = 'center'; fx.textBaseline = 'middle';
    for (const o of tokens) {
      const kk = o.life / o.max, a = kk < .15 ? kk / .15 : 1 - (kk - .15) / .85;
      fx.save(); fx.translate(o.x, o.y); fx.rotate(o.rot); fx.globalAlpha = Math.max(0, a);
      fx.font = `600 ${o.size}px ${FONT}`;
      fx.shadowColor = 'rgba(240,140,50,.7)'; fx.shadowBlur = 10;
      fx.fillStyle = o.txt === '♥' ? '#ff8a6a' : '#ffd79a'; fx.fillText(o.txt, 0, 0); fx.restore();
    }
    for (const b of speech) {
      const kk = b.life / b.max, a = kk < .1 ? kk / .1 : kk > .85 ? (1 - kk) / .15 : 1;
      fx.save(); fx.globalAlpha = a; fx.font = `600 13px ${FONT}`;
      const tw = fx.measureText(b.text).width, pw = tw + 20, ph = 26;
      const bx0 = clamp(b.x - pw / 2, 8, W - pw - 8), by0 = b.y - ph - 8 - (1 - Math.min(1, kk * 6)) * 6;
      fx.fillStyle = 'rgba(255,250,240,.96)'; fx.shadowColor = 'rgba(0,0,0,.25)'; fx.shadowBlur = 10;
      fx.beginPath(); fx.roundRect ? fx.roundRect(bx0, by0, pw, ph, 13) : fx.rect(bx0, by0, pw, ph); fx.fill();
      fx.beginPath(); fx.moveTo(clamp(b.x, bx0 + 14, bx0 + pw - 14) - 6, by0 + ph - 1); fx.lineTo(clamp(b.x, bx0 + 14, bx0 + pw - 14), by0 + ph + 7); fx.lineTo(clamp(b.x, bx0 + 14, bx0 + pw - 14) + 6, by0 + ph - 1); fx.fill();
      fx.shadowBlur = 0; fx.fillStyle = '#2a1a14'; fx.fillText(b.text, bx0 + pw / 2, by0 + ph / 2 + 1);
      fx.restore();
    }
  }

  function letters(t) {
    for (let i = 0; i < chars.length; i++) {
      const p = reduce ? 1 : clamp((t - .5 - i * .08) / 1.3, 0, 1);
      const e = 1 - Math.pow(1 - p, 3);
      const bob = reduce ? 0 : Math.sin(T * 1.3 + i * .5) * 2.2 * e;
      const y = (1 - e) * 60 + bob;
      const r = reduce ? 0 : Math.sin(T * 1.1 + i * .9) * .7 * e;
      const st = chars[i].style;
      st.transform = `translate3d(0,${y.toFixed(2)}px,0) rotate(${r.toFixed(2)}deg)`;
      st.opacity = Math.min(1, p * 1.5).toFixed(3);
      st.filter = p < 1 ? `blur(${((1 - e) * 10).toFixed(2)}px)` : 'none';
    }
  }

  if (params.has('debug')) window.__hv = { Q, groundY, mills, spawnQuijote, get S() { return S; } };
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
