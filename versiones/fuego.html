<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hervidero Creativo</title>
<meta name="description" content="Hervidero Creativo. Las ideas ya están en ebullición. Muy pronto, nuestra web.">
<meta property="og:title" content="Hervidero Creativo">
<meta property="og:description" content="Las ideas ya están en ebullición. Muy pronto, nuestra web.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0c0809">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23ff5a1f'/%3E%3Ccircle cx='24' cy='38' r='8' fill='none' stroke='%23fff4ea' stroke-width='4'/%3E%3Ccircle cx='40' cy='23' r='5' fill='none' stroke='%23fff4ea' stroke-width='4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Fraunces:ital,opsz,wght@1,9..144,500&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<script>document.documentElement.classList.add('js')</script>
<style>
  :root{
    --bg:#0c0809;
    --ink:#fff4ea;
    --muted:rgba(255,236,220,.62);
    --hot:#ff5a1f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:'Space Grotesk',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #back{z-index:1;cursor:crosshair;touch-action:none}
  #steam{z-index:3;pointer-events:none}

  .stage{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;
    padding:clamp(36px,9vh,110px) 16px 0;text-align:center;pointer-events:none}
  .kicker{margin:0;letter-spacing:.34em;text-transform:uppercase;font-size:12px;font-weight:500;color:var(--muted)}
  h1{margin:.35em 0 .15em;line-height:.86;font-weight:400}
  h1 .row{display:block;white-space:nowrap}
  h1 .r1{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;letter-spacing:-.045em;
    font-size:clamp(54px,13.5vw,176px)}
  h1 .r2{font-family:'Fraunces',Georgia,serif;font-style:italic;font-weight:500;letter-spacing:-.02em;
    font-size:clamp(46px,11.5vw,150px);margin-top:.02em;text-shadow:0 0 40px rgba(255,90,31,.35)}
  h1 .ch{display:inline-block;will-change:transform,opacity}
  .tag{margin:.6em 0 0;font-size:clamp(16px,2.1vw,21px);line-height:1.45;color:var(--muted);max-width:30ch}

  .foot{position:fixed;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));z-index:4;
    display:flex;flex-direction:column;align-items:center;gap:12px;padding:0 16px;pointer-events:none}
  .cta{pointer-events:auto;color:var(--ink);text-decoration:none;font-size:14px;font-weight:500;letter-spacing:.02em;
    border:1px solid rgba(255,244,234,.28);padding:11px 22px;border-radius:999px;
    background:rgba(12,8,9,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    transition:background .25s,border-color .25s,transform .25s}
  .cta:hover,.cta:focus-visible{background:rgba(255,90,31,.85);border-color:transparent;transform:translateY(-2px);outline:none}
  .small{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,236,220,.55);text-shadow:0 1px 8px rgba(0,0,0,.8)}
  .hint{position:fixed;z-index:4;left:50%;transform:translateX(-50%);font-size:12px;letter-spacing:.2em;
    text-transform:uppercase;color:rgba(255,244,234,.75);text-shadow:0 1px 10px rgba(0,0,0,.9);pointer-events:none;white-space:nowrap}

  .js .fade{opacity:0;transition:opacity 1.2s ease}
  .js .fade.on{opacity:1}
  .js h1 .ch{opacity:0}
  @media (prefers-reduced-motion:reduce){ .js .fade{transition:none} }
</style>
</head>
<body>
  <canvas id="back" aria-hidden="true"></canvas>

  <main class="stage">
    <p class="kicker fade" data-d="300">Algo se está cociendo</p>
    <h1 aria-label="Hervidero Creativo">
      <span class="row r1" aria-hidden="true">Hervidero</span>
      <span class="row r2" aria-hidden="true">Creativo</span>
    </h1>
    <p class="tag fade" data-d="2100">Las ideas ya están en ebullición.<br>Muy pronto, nuestra web.</p>
  </main>

  <div class="hint fade" id="hint" data-d="4200">Haz clic en el agua</div>

  <footer class="foot">
    <a class="cta fade" data-d="2600" href="mailto:super@herviderocreativo.com">Escríbenos</a>
    <span class="small fade" data-d="3000">© 2026 Hervidero Creativo</span>
  </footer>

  <canvas id="steam" aria-hidden="true"></canvas>

<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const touch = matchMedia('(hover: none)').matches;
  const back = document.getElementById('back'), bx = back.getContext('2d');
  const steamC = document.getElementById('steam'), sx = steamC.getContext('2d');
  const tag = document.querySelector('.tag');
  const hint = document.getElementById('hint');
  if (touch) hint.textContent = 'Toca el agua';

  /* ---------- Letras: se dividen en spans para que "emerjan" y tiemblen con el hervor ---------- */
  const chars = [];
  document.querySelectorAll('h1 .row').forEach((row, ri) => {
    const txt = row.textContent; row.textContent = '';
    [...txt].forEach((ch, i) => {
      const s = document.createElement('span');
      s.className = 'ch'; s.textContent = ch;
      if (ri === 1) { // "Creativo" en degradado de fuego, letra a letra
        const k = i / Math.max(1, txt.length - 1);
        s.style.color = `hsl(${14 + k * 24},100%,${57 + k * 6}%)`;
      }
      row.appendChild(s); chars.push(s);
    });
  });

  /* ---------- Fundidos de los textos secundarios ---------- */
  document.querySelectorAll('.fade').forEach(el => {
    setTimeout(() => el.classList.add('on'), reduce ? 0 : +el.dataset.d || 0);
  });
  let hintGone = false;
  const killHint = () => { if (!hintGone) { hintGone = true; hint.classList.remove('on'); } };

  /* ---------- Sprite de vapor ---------- */
  const sprite = document.createElement('canvas'); sprite.width = sprite.height = 128;
  { const s = sprite.getContext('2d'), g = s.createRadialGradient(64, 64, 0, 64, 64, 64);
    g.addColorStop(0, 'rgba(255,248,240,1)'); g.addColorStop(.45, 'rgba(255,248,240,.4)'); g.addColorStop(1, 'rgba(255,248,240,0)');
    s.fillStyle = g; s.fillRect(0, 0, 128, 128); }

  /* ---------- Estado ---------- */
  let W = 0, H = 0, DPR = 1, surf = 0, step = 8, N = 0, hgt, vel, heat = [];
  const bubbles = [], drops = [], steam = [];
  let T = 0, boil = 0, burst = 0, bAcc = 0, sAcc = 0, pAcc = 0;
  const ptr = { x: -1, y: -1, on: false };

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    for (const [c, x] of [[back, bx], [steamC, sx]]) {
      c.width = Math.round(W * DPR); c.height = Math.round(H * DPR);
      x.setTransform(DPR, 0, 0, DPR, 0, 0);
    }
    const tb = tag.getBoundingClientRect().bottom;
    surf = Math.min(H * 0.8, Math.max(H * 0.55, tb + 50));
    step = W < 700 ? 6 : 8;
    N = Math.ceil(W / step) + 2;
    hgt = new Float32Array(N); vel = new Float32Array(N);
    const n = W < 700 ? 3 : 5;
    heat = Array.from({ length: n }, (_, i) => ({ x: (i + .5) / n * W, ph: Math.random() * 6.28, sp: .25 + Math.random() * .35 }));
    hint.style.top = Math.min(H - 110, surf + (H - surf) * 0.45) + 'px';
  }
  addEventListener('resize', resize);
  resize();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(resize);

  /* ---------- Superficie del agua ---------- */
  const amb = x => { const a = 1.5 + 6 * boil; return Math.sin(x * .012 + T * 1.4) * a * .6 + Math.sin(x * .031 - T * 2.3) * a * .4; };
  const idx = x => Math.max(0, Math.min(N - 1, Math.round(x / step)));
  const surfAt = x => surf + hgt[idx(x)] + amb(x);
  function poke(x, f) {
    const i = idx(x);
    for (let k = -2; k <= 2; k++) { const j = i + k; if (j >= 0 && j < N) vel[j] += f * (1 - Math.abs(k) * .3); }
  }
  function waterStep() {
    for (let i = 0; i < N; i++) { vel[i] += -.03 * hgt[i] - .05 * vel[i]; hgt[i] += vel[i]; }
    for (let p = 0; p < 3; p++) for (let i = 1; i < N - 1; i++) vel[i] += .1 * (hgt[i - 1] + hgt[i + 1] - 2 * hgt[i]);
  }

  /* ---------- Partículas ---------- */
  const rnd = (a, b) => a + Math.random() * (b - a);
  function addBubble(x, y, r) {
    if (bubbles.length > 450) return;
    bubbles.push({ x, y, r, vy: -rnd(10, 40), ph: rnd(0, 6.28), w: rnd(.5, 2) });
  }
  function addSteam(x, y, big) {
    if (steam.length > 220) return;
    steam.push({ x, y, vx: rnd(-8, 8), vy: -rnd(22, 55), life: 0, max: rnd(3, 6), size: rnd(18, 40) * (big ? 1.6 : 1), seed: rnd(0, 6.28) });
  }
  function pop(b, sy) {
    poke(b.x, -b.r * .6);
    if (b.r > 3.5) {
      const n = Math.min(6, Math.floor(b.r / 2));
      for (let i = 0; i < n && drops.length < 260; i++)
        drops.push({ x: b.x, y: sy - 2, vx: rnd(-70, 70), vy: -rnd(90, 220) * (b.r / 7), r: rnd(.8, 2.2) });
    }
    if (Math.random() < .3 + boil * .35) addSteam(b.x, sy, b.r > 6);
  }
  function heatX() {
    if (Math.random() < .3) return rnd(0, W);
    const h = heat[(Math.random() * heat.length) | 0];
    return h.x + Math.sin(T * h.sp + h.ph) * 50 + (Math.random() + Math.random() - 1) * 110;
  }

  /* ---------- Interacción ---------- */
  function setPtr(e) { ptr.x = e.clientX; ptr.y = e.clientY; ptr.on = true; }
  back.addEventListener('pointermove', setPtr);
  back.addEventListener('pointerleave', () => ptr.on = false);
  back.addEventListener('pointerdown', e => {
    setPtr(e); killHint();
    burst = Math.min(1.4, burst + .8);
    const sy = surfAt(e.clientX);
    const fromY = e.clientY > sy ? e.clientY : H - 10;
    for (let i = 0; i < 28; i++) addBubble(e.clientX + rnd(-60, 60), fromY + rnd(-10, 30), rnd(2, 7));
    poke(e.clientX, -10);
    for (let i = 0; i < 5; i++) addSteam(e.clientX + rnd(-40, 40), sy, true);
    if (touch) setTimeout(() => ptr.on = false, 400);
  });

  /* ---------- Bucle ---------- */
  const start = performance.now(); let last = start, simAcc = 0;
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now; T += dt;
    const t = (now - start) / 1000;

    // nivel de hervor: arranca templado y llega a ebullición en ~3,5 s
    const ramp = reduce ? .45 : Math.min(1, t / 3.5);
    const base = (ramp * ramp * (3 - 2 * ramp)) * (.88 + .12 * Math.sin(T * .5));
    burst *= Math.pow(.3, dt);
    boil = base + burst * .6;
    const k = reduce ? .4 : 1;
    const area = W / 1200;

    // simulación de la superficie a paso fijo
    simAcc += dt;
    while (simAcc >= 1 / 60) { waterStep(); simAcc -= 1 / 60; }

    // generación de burbujas
    bAcc += (boil * boil * 110 + burst * 160) * area * k * dt;
    while (bAcc >= 1) { bAcc--; addBubble(heatX(), H - rnd(0, 18), rnd(1.2, 2.5 + 4.5 * boil)); }
    if (ptr.on && ptr.y > surfAt(ptr.x)) {
      pAcc += 45 * dt;
      while (pAcc >= 1) { pAcc--; addBubble(ptr.x + rnd(-14, 14), ptr.y + rnd(-6, 6), rnd(1.5, 5)); }
    } else if (ptr.on && Math.abs(ptr.y - surfAt(ptr.x)) < 30) { poke(ptr.x, -.6); }
    sAcc += (boil * 16 + 2) * area * k * dt;
    while (sAcc >= 1) { sAcc--; const x = rnd(0, W); addSteam(x, surfAt(x)); }

    // burbujas
    for (let i = bubbles.length - 1; i >= 0; i--) {
      const b = bubbles[i];
      b.vy -= (28 + b.r * 14) * dt; b.vy *= .985;
      b.y += b.vy * dt;
      b.x += Math.sin(T * 3 * b.w + b.ph) * b.r * .12;
      b.r = Math.min(b.r * (1 + .14 * dt), 11);
      const sy = surfAt(b.x);
      if (b.y - b.r * .3 <= sy) { pop(b, sy); bubbles.splice(i, 1); }
    }
    // gotas
    for (let i = drops.length - 1; i >= 0; i--) {
      const d = drops[i];
      d.vy += 650 * dt; d.x += d.vx * dt; d.y += d.vy * dt;
      if (d.vy > 0 && d.y > surfAt(d.x)) { poke(d.x, 1.2 * d.r); drops.splice(i, 1); }
    }
    // vapor
    for (let i = steam.length - 1; i >= 0; i--) {
      const s = steam[i];
      s.life += dt;
      s.vx += Math.sin(T * .7 + s.seed) * 10 * dt;
      s.x += s.vx * dt; s.y += s.vy * dt; s.vy *= (1 - .15 * dt);
      s.size += 30 * dt;
      if (s.life > s.max) steam.splice(i, 1);
    }

    draw();
    letters(t);
    requestAnimationFrame(frame);
  }

  function surfacePath(ctx, cont) {
    ctx[cont ? 'lineTo' : 'moveTo'](0, surf + hgt[0] + amb(0));
    for (let i = 1; i < N; i++) { const x = i * step; ctx.lineTo(x, surf + hgt[i] + amb(x)); }
  }

  function draw() {
    const x = bx;
    // fondo
    const bg = x.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#0c0809'); bg.addColorStop(1, '#1a0d0b');
    x.fillStyle = bg; x.fillRect(0, 0, W, H);

    // agua
    x.beginPath(); x.moveTo(0, H); surfacePath(x, true); x.lineTo(W, H); x.closePath();
    const wg = x.createLinearGradient(0, surf - 20, 0, H);
    wg.addColorStop(0, 'rgba(70,150,168,.45)');
    wg.addColorStop(.3, 'rgba(26,74,98,.7)');
    wg.addColorStop(1, 'rgba(12,26,40,.85)');
    x.fillStyle = wg; x.fill();

    // fuego bajo el agua
    x.globalCompositeOperation = 'lighter';
    const R = (W < 700 ? 200 : 300) * (.55 + .5 * boil);
    for (const h of heat) {
      const hx = h.x + Math.sin(T * h.sp + h.ph) * 50;
      const fl = .85 + .15 * Math.sin(T * 9 + h.ph) * Math.sin(T * 3.7 + h.ph * 2);
      const a = (.12 + .38 * Math.min(1.3, boil)) * fl;
      const g = x.createRadialGradient(hx, H + 30, 0, hx, H + 30, R);
      g.addColorStop(0, `rgba(255,120,40,${a})`);
      g.addColorStop(.45, `rgba(255,60,20,${a * .35})`);
      g.addColorStop(1, 'rgba(255,40,10,0)');
      x.fillStyle = g; x.fillRect(hx - R, H + 30 - R, R * 2, R);
    }
    x.globalCompositeOperation = 'source-over';

    // burbujas
    x.lineWidth = 1;
    for (const b of bubbles) {
      x.beginPath(); x.arc(b.x, b.y, b.r, 0, 6.2832);
      x.fillStyle = 'rgba(255,232,214,.08)'; x.fill();
      x.strokeStyle = 'rgba(255,240,228,.55)'; x.stroke();
      if (b.r > 2.6) {
        x.beginPath(); x.arc(b.x - b.r * .35, b.y - b.r * .38, b.r * .22, 0, 6.2832);
        x.fillStyle = 'rgba(255,255,255,.75)'; x.fill();
      }
    }

    // línea de superficie con brillo
    x.beginPath(); surfacePath(x);
    x.strokeStyle = 'rgba(255,150,90,.12)'; x.lineWidth = 8; x.stroke();
    x.strokeStyle = 'rgba(255,238,224,.6)'; x.lineWidth = 1.5; x.stroke();

    // gotas
    x.fillStyle = 'rgba(214,240,246,.85)';
    for (const d of drops) { x.beginPath(); x.arc(d.x, d.y, d.r, 0, 6.2832); x.fill(); }

    // vapor (en el lienzo de delante, pasa por encima del título)
    sx.clearRect(0, 0, W, H);
    for (const s of steam) {
      const a = Math.sin(Math.PI * s.life / s.max) * (.07 + .07 * Math.min(1, boil));
      if (a <= 0) continue;
      sx.globalAlpha = a;
      sx.drawImage(sprite, s.x - s.size / 2, s.y - s.size / 2, s.size, s.size);
    }
    sx.globalAlpha = 1;
  }

  function letters(t) {
    const j = reduce ? 0 : Math.min(1.6, boil * (.5 + burst));
    for (let i = 0; i < chars.length; i++) {
      const p = reduce ? 1 : Math.min(1, Math.max(0, (t - .5 - i * .075) / 1.1));
      const e = 1 - Math.pow(1 - p, 3);
      const y = (1 - e) * 70 + Math.sin(T * 11 + i * 1.9) * 1.3 * j + Math.sin(T * 5.3 + i * .7) * 1.1 * j;
      const r = Math.sin(T * 7 + i * 2.3) * 1.1 * j;
      const el = chars[i].style;
      el.transform = `translate3d(0,${y.toFixed(2)}px,0) rotate(${r.toFixed(2)}deg)`;
      el.opacity = Math.min(1, p * 1.5).toFixed(3);
      el.filter = p < 1 ? `blur(${((1 - e) * 8).toFixed(2)}px)` : 'none';
    }
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
